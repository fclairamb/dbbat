  /grant-definitions:
    post:
      tags:
        - Grant Definitions
      summary: Create grant definition (admin)
      description: |
        Creates a new admin-managed grant definition. A definition is the shape
        of a grant and the only source of one: users request access by picking
        an active definition, and admins assign it directly with
        `POST /grants`. There is no way to create a grant without a definition.
      operationId: createGrantDefinition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGrantDefinitionRequest'
      responses:
        '200':
          description: Definition created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantDefinition'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

    get:
      tags:
        - Grant Definitions
      summary: List grant definitions
      description: |
        Lists grant definitions. Non-admins always receive only active
        definitions that are in scope for their user groups (out-of-scope
        definitions are invisible, not greyed out); admin listings are
        unfiltered. Admins can pass `active_only=true` to apply the same
        filter for the request UI; otherwise both active and deactivated
        definitions are returned.
      operationId: listGrantDefinitions
      parameters:
        - name: active_only
          in: query
          description: Restrict to active definitions
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: List of grant definitions
          content:
            application/json:
              schema:
                type: object
                properties:
                  grant_definitions:
                    type: array
                    items:
                      $ref: '#/components/schemas/GrantDefinition'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /grant-definitions/{uid}:
    parameters:
      - name: uid
        in: path
        required: true
        description: |
          Either the definition's uid or its slug. A syntactically
          UUID-shaped value is looked up as a uid only — slugs can never be
          UUID-shaped, so there is no fallback to attempt.
        schema:
          type: string

    get:
      tags:
        - Grant Definitions
      summary: Get grant definition by uid or slug
      operationId: getGrantDefinition
      responses:
        '200':
          description: Definition details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantDefinition'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags:
        - Grant Definitions
      summary: Update grant definition (admin)
      description: |
        Partial update: only fields present in the body are changed (created_by
        / created_at / is_active always stay put). A field omitted from the
        body is left untouched on the existing definition — so a caller that
        only means to flip `auto_approve`, say, can send just that field
        without risk of wiping the rest, notably `approval_patterns` and
        `approver_user_group_uids`.

        **An edit creates a new version.** The current row is archived
        (`archived_at` set) and a successor carrying the change is inserted
        with a new `uid` and the same `lineage_uid`; the response is that new
        version. Grants already issued keep pointing at the version they were
        issued from, so their behavior never changes. An edit that changes
        nothing is not versioned.

        Editing an already-archived version is refused with a 409 — history is
        immutable, and the caller means the live version.
      operationId: updateGrantDefinition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGrantDefinitionRequest'
      responses:
        '200':
          description: Definition updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantDefinition'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

    delete:
      tags:
        - Grant Definitions
      summary: Deactivate (or delete) grant definition (admin)
      description: |
        Deactivates the definition by flipping `is_active` to false across its
        **whole version lineage**. This is a withdrawal and it **fails closed**:
        every grant issued from any version stops authorising new connections
        on its next authentication. The response reports how many active grants
        that affected.

        Pass `hard=true` to delete the definition and its version history
        outright. That only ever succeeds for a definition nothing references:
        a grant's shape lives on its definition, so deleting one out from under
        a grant is refused with a 409 naming the blocking counts. Deactivation
        is the operation for retiring a definition that has been used.
      operationId: deactivateGrantDefinition
      parameters:
        - name: hard
          in: query
          description: Delete the definition instead of deactivating it. Refused with 409 if anything references it.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Definition deactivated (or deleted)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeactivateGrantDefinitionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /grant-definitions/validate-patterns:
    post:
      tags:
        - Grant Definitions
      summary: Preview approval patterns against sample queries (admin)
      description: |
        Pure compute endpoint — no store access, nothing persisted, no
        definition needs to exist yet. Lets an admin authoring
        `approval_patterns` see, before saving anything:

        - which patterns fail to **compile** — the exact error
          [`NewApprovalGate`](../../internal/proxy/shared/approval.go)
          otherwise swallows with only a server-side warning log, silently
          degrading a bad pattern to "no hold";
        - for each sample query: its `NormalizeSQL` form (what the patterns
          actually run against — not the raw text) and which pattern, if any,
          matches it first, using **exactly**
          [`ApprovalGate.Match`](../../internal/proxy/shared/approval.go)'s
          semantics, so this preview can never disagree with what the proxy
          will actually do.

        A pattern that fails to compile is the only thing that should block a
        save (enforced by `POST`/`PATCH /grant-definitions`, not by this
        endpoint). A sample that simply does not match a pattern is not an
        error — an author may legitimately save a bench that is currently red
        while iterating.
      operationId: validateGrantDefinitionPatterns
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidatePatternsRequest'
      responses:
        '200':
          description: Compile and match results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidatePatternsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /grant-requests:
    post:
      tags:
        - Grant Requests
      summary: Submit a grant request
      description: |
        Any authenticated user can request access by selecting a grant
        definition and a database. An admin then approves or denies. On
        approval, dbbat creates a real AccessGrant from the definition.

        A definition scoped to user groups and/or databases can only be
        requested by a member of one of those groups, and only against one of
        those databases — otherwise the request is rejected with 403. This
        also gates the auto-approve path, where no human ever reviews.
      operationId: createGrantRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGrantRequestPayload'
      responses:
        '200':
          description: Grant request submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The definition's group/database scope does not cover this user or database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: A pending request already exists for this user/database/definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      tags:
        - Grant Requests
      summary: List grant requests
      description: Admins see all (filterable). Non-admins see only their own.
      operationId: listGrantRequests
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, denied, cancelled, expired]
        - name: user_id
          in: query
          schema:
            type: string
            format: uuid
        - name: database_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of grant requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  grant_requests:
                    type: array
                    items:
                      $ref: '#/components/schemas/GrantRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /grant-requests/{uid}:
    parameters:
      - name: uid
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags:
        - Grant Requests
      summary: Get grant request
      operationId: getGrantRequest
      responses:
        '200':
          description: Grant request details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /grant-requests/{uid}/approve:
    parameters:
      - name: uid
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - Grant Requests
      summary: Approve grant request (admin)
      description: |
        Atomically transitions pending → approved and creates a real
        AccessGrant from the linked definition + the request's
        user/database. Returns 409 if not pending or if the linked
        definition has been deactivated.
      operationId: approveGrantRequest
      responses:
        '200':
          description: Approved; resulting grant included
          content:
            application/json:
              schema:
                type: object
                properties:
                  grant_request:
                    $ref: '#/components/schemas/GrantRequest'
                  grant:
                    $ref: '#/components/schemas/AccessGrant'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Not pending, definition inactive, or the definition's scope no
            longer covers the requester or the database (scope is re-checked
            at approve time so a tightened scope hard-blocks pending requests).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /grant-requests/{uid}/deny:
    parameters:
      - name: uid
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - Grant Requests
      summary: Deny grant request (admin)
      operationId: denyGrantRequest
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Not pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /grant-requests/{uid}/cancel:
    parameters:
      - name: uid
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - Grant Requests
      summary: Cancel grant request (requester or admin)
      operationId: cancelGrantRequest
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Not pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /keys:
    post:
      tags:
        - API Keys
      summary: Create API key
      description: |
        Creates a new API key for the authenticated user.

        **Important**: The full API key is only returned once in this response.
        Store it securely as it cannot be retrieved later.

        Requires Web Session or Basic Auth (API keys cannot create other API keys).
      operationId: createAPIKey
      security:
        - basicAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAPIKeyRequest'
      responses:
        '201':
          description: API key created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAPIKeyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

    get:
      tags:
        - API Keys
      summary: List API keys
      description: |
        Returns a list of API keys.

        - Default for every caller, including admins: only the caller's own
          keys.
        - Admins can override the default with `all_users=true` (every user's
          keys) or `user_id=<uuid>` (one specific user's keys). If both are
          given, `user_id` wins.
        - Non-admins can never see another user's keys: `all_users` and
          `user_id` are ignored for them.
      operationId: listAPIKeys
      parameters:
        - name: user_id
          in: query
          description: >-
            Return only this user's keys (admin only). Overrides the
            own-keys-by-default behavior; wins over all_users if both are set.
          schema:
            type: string
            format: uuid
        - name: all_users
          in: query
          description: >-
            Return every user's keys instead of just the caller's own (admin
            only; ignored for non-admins).
          schema:
            type: boolean
            default: false
        - name: include_all
          in: query
          description: Include revoked and expired keys
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: List of API keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      $ref: '#/components/schemas/APIKey'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /keys/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: API key ID
        schema:
          type: string
          format: uuid

    get:
      tags:
        - API Keys
      summary: Get API key by ID
      description: |
        Retrieves a specific API key.

        Non-admins can only see their own keys.
      operationId: getAPIKey
      responses:
        '200':
          description: API key details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKey'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - API Keys
      summary: Revoke API key
      description: |
        Revokes an API key.

        - Non-admins can only revoke their own keys
        - Requires Web Session or Basic Auth (API keys cannot revoke API keys)
      operationId: revokeAPIKey
      security:
        - basicAuth: []
        - bearerAuth: []
      responses:
        '204':
          description: API key revoked successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /connections:
    get:
      tags:
        - Connections
      summary: List connections
      description: |
        Returns a list of proxy connections.

        Connectors can only see their own connections.
      operationId: listConnections
      parameters:
        - name: user_id
          in: query
          description: Filter by user UID
          schema:
            type: string
            format: uuid
        - name: database_id
          in: query
          description: Filter by database UID
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: List of connections
          content:
            application/json:
              schema:
                type: object
                properties:
                  connections:
                    type: array
                    items:
                      $ref: '#/components/schemas/Connection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /connections/{uid}:
    parameters:
      - $ref: '#/components/parameters/ConnectionUID'

    get:
      tags:
        - Connections
      summary: Get connection details
      description: |
        Retrieves a specific connection.

        Connectors can only fetch their own connections. Connections
        belonging to another user are reported as `404 Not Found` (not
        `403 Forbidden`) so their existence isn't leaked.
      operationId: getConnection
      responses:
        '200':
          description: Connection details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /connections/{uid}/dump:
    parameters:
      - $ref: '#/components/parameters/ConnectionUID'

    get:
      tags:
        - Connections
      summary: Download the session capture
      description: |
        Downloads the raw packet capture recorded for a connection.

        The body is a standard **pcapng** file (media type
        `application/x-pcapng`, extension `.pcapng`) — not a bespoke dbbat
        format. Anything that reads pcapng reads it: `tcpdump`, Wireshark,
        `tshark`, `capinfos`, `editcap`, scapy, `gopacket`. Wireshark applies
        its native PostgreSQL, Oracle TNS, MySQL and MongoDB dissectors to the
        payloads. The same file structure is produced for every protocol; see
        `docs/dump-format.md` in the dbbat repository for the full reference
        (packet framing, the session metadata block, and the
        `dbbat dump anonymise` command).

        Captures are only written when the server is started with a dump
        directory configured (`DBB_DUMP_DIR`) and are capped per session
        (`DBB_DUMP_MAX_SIZE`). `404 Not Found` is therefore returned in two
        distinct cases: dumps are disabled server-wide (`dumps are not
        enabled`), or no capture exists — or no longer exists — for this
        connection (`no dump available for this connection`).

        Where a capture lives depends on the deployment. Without
        `DBB_DUMP_UPLOAD_URL` it stays on the local disk of the replica that
        recorded it and is reaped once older than `DBB_DUMP_RETENTION` (24h by
        default). With an upload URL configured, the finished capture is moved
        to blob storage (S3 or any gocloud.dev-supported bucket) when the
        session closes, and this endpoint streams it back from there — so any
        replica can serve it, and how long it survives is the bucket's own
        lifecycle policy rather than `DBB_DUMP_RETENTION`.

        **Requires admin role.** This endpoint used to be reachable by admin
        or viewer roles; as of this change it is admin-only. A capture is the
        raw byte stream of the session, including the authentication
        handshake and every result row, at a fidelity well past the redacted,
        structured view a viewer gets from the queries pages — so the API is
        now the enforcement boundary rather than the UI hiding the link.
      operationId: getConnectionDump
      responses:
        '200':
          description: The pcapng session capture
          headers:
            Content-Disposition:
              description: |
                Always `attachment; filename="<uid>.pcapng"`, where `<uid>` is
                the connection UID from the path.
              schema:
                type: string
              example: attachment; filename="7a1f1c9e-8f3a-4d2b-9f21-0c5e6b3d4a77.pcapng"
          content:
            application/x-pcapng:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags:
        - Connections
      summary: Delete the session capture
      description: |
        Deletes the pcapng capture recorded for a connection.

        Only the capture is removed — the connection record and its logged
        queries are left untouched. The deletion is immediate and cannot be
        undone, and it covers the capture wherever it currently lives: the
        local spool, the configured blob store (`DBB_DUMP_UPLOAD_URL`), or
        both while an upload is in flight. Local captures are also removed
        automatically once they are older than `DBB_DUMP_RETENTION`; uploaded
        ones are only expired by the bucket's lifecycle policy.

        As with the download, `404 Not Found` covers both dumps being
        disabled server-wide and no capture being available for this
        connection.

        Requires admin role.
      operationId: deleteConnectionDump
      responses:
        '204':
          description: Capture deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /stream:
    get:
      tags:
        - Queries
      summary: Live event stream (WebSocket)
      description: |
        Upgrades to a WebSocket carrying live events by topic.

        **Authentication.** Browsers cannot set an `Authorization` header on a
        WebSocket handshake, so the bearer token may instead be sent as a
        subprotocol: `Sec-WebSocket-Protocol: dbbat.auth.bearer.<token>`. The
        server echoes the selected subprotocol back. A normal `Authorization`
        header also works (non-browser clients).

        **Protocol.**

        ```jsonc
        // client → server
        {"type": "subscribe",   "topic": "connection/<uid>/queries"}
        {"type": "unsubscribe", "topic": "connection/<uid>/queries"}
        // server → client
        {"type": "subscribed",   "topic": "...", "error": null}
        {"type": "unsubscribed", "topic": "..."}
        {"type": "event", "topic": "...", "seq": 1234, "event": "query", "at": "...", "data": {...}}
        {"type": "lagged", "dropped": 12}
        ```

        **Topics and who may subscribe.**

        | Topic | Payload | Who |
        |---|---|---|
        | `connection/<uid>/queries` | every query on that connection | admin, viewer, or the connection's owner |
        | `approvals/pending` | approval-pending queries, all connections | admin, viewer, or a member of an approver group |
        | `connections` | connection open/close | admin |

        Authorization is evaluated at subscribe time **and re-checked on every
        send** — a topic grants exactly what the equivalent REST endpoint
        would, never more.

        `approvals/pending` is additionally filtered **per event**: it is a
        global fan-out, so admins and viewers receive every held statement
        while anybody else receives only holds they are an approver for —
        exactly the rows `GET /api/v1/queries/pending` would return them.

        **Backpressure.** Each subscriber has a bounded send buffer. On
        overflow events are dropped and a `lagged` frame is emitted; the client
        should then refetch from REST. The `approvals/pending` topic is exempt
        from dropping.

        Event `data` carries `query_uid`, `connection_uid`, `sql_text`,
        `executed_at`, `approval_required` and `approval_status`; resolution
        events additionally carry `resolved_by` (`{uid, username,
        display_name}`), `resolved_at` and `resolution_reason`.
      operationId: streamEvents
      responses:
        '101':
          description: Switching protocols (WebSocket established)
        '400':
          description: Not a WebSocket upgrade request
        '401':
          $ref: '#/components/responses/Unauthorized'

  /queries/pending:
    get:
      tags:
        - Queries
      summary: List queries awaiting approval
      description: |
        Returns every query currently parked awaiting a human decision.

        This is the authoritative "what is pending now" view; the live stream
        is best-effort for history, so clients refetch this on reconnect.

        Admins and viewers see every hold; other users see only holds they are
        an approver for.
      operationId: listPendingApprovals
      responses:
        '200':
          description: Pending approvals
          content:
            application/json:
              schema:
                type: object
                properties:
                  queries:
                    type: array
                    items:
                      $ref: '#/components/schemas/Query'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /queries/pending/deny-all:
    post:
      tags:
        - Queries
      summary: Deny every pending approval
      description: |
        Bulk safety valve. Because a hold has no timeout, an operator needs one
        action that clears every parked statement — after a bad deploy, during
        an incident, or at the end of a shift.

        Requires the admin role. Holds the caller themselves requested are
        skipped, as is any hold the caller is not an approver for.
      operationId: denyAllPendingApprovals
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Reason recorded on every denied hold
      responses:
        '200':
          description: Bulk denial result
          content:
            application/json:
              schema:
                type: object
                properties:
                  denied:
                    type: integer
                  skipped:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /queries/{uid}/approve:
    post:
      tags:
        - Queries
      summary: Approve a held query
      description: |
        Releases a statement parked on an approval hold; it is then forwarded
        upstream and runs.

        Approval is **by query UID** — the approver decides on exactly the
        statement they were shown, and the waiting proxy session independently
        asserts the resolved UID is its own before acting.

        The approver must be an admin or a member of one of the grant's
        approver groups, and **may never be the user who ran the query**:
        self-approval is rejected even for admins.

        Writes an audit event and publishes a resolution event on the stream.
      operationId: approveQuery
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Query approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalResolution'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not an approver, or attempted self-approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The query is no longer awaiting approval (already resolved, or the client gave up)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /queries/{uid}/deny:
    post:
      tags:
        - Queries
      summary: Deny a held query
      description: |
        Rejects a statement parked on an approval hold. Nothing is forwarded
        upstream; the client receives a protocol-native error carrying the
        reason.

        Same authorization rules as approve, including the self-approval
        rejection.
      operationId: denyQuery
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Reason shown to the client and recorded on the query
      responses:
        '200':
          description: Query denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalResolution'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not an approver, or attempted self-approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The query is no longer awaiting approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /queries:
    get:
      tags:
        - Queries
      summary: List queries
      description: |
        Returns a list of executed queries.

        Requires admin or viewer role.
      operationId: listQueries
      parameters:
        - name: connection_id
          in: query
          description: Filter by connection UID
          schema:
            type: string
            format: uuid
        - name: user_id
          in: query
          description: Filter by user UID
          schema:
            type: string
            format: uuid
        - name: database_id
          in: query
          description: Filter by database UID
          schema:
            type: string
            format: uuid
        - name: start_time
          in: query
          description: Filter by start time (RFC3339 format)
          schema:
            type: string
            format: date-time
        - name: end_time
          in: query
          description: Filter by end time (RFC3339 format)
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: List of queries
          content:
            application/json:
              schema:
                type: object
                properties:
                  queries:
                    type: array
                    items:
                      $ref: '#/components/schemas/Query'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /queries/{uid}:
    parameters:
      - $ref: '#/components/parameters/QueryUID'

    get:
      tags:
        - Queries
      summary: Get query details
      description: |
        Retrieves a specific query without its result rows.

        Use `GET /queries/{uid}/rows` to retrieve the result rows.

        Requires admin or viewer role.
      operationId: getQuery
      responses:
        '200':
          description: Query details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Query'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /queries/{uid}/rows:
    parameters:
      - $ref: '#/components/parameters/QueryUID'

    get:
      tags:
        - Queries
      summary: List query result rows (paginated)
      description: |
        Retrieves paginated result rows for a specific query.

        Uses cursor-based pagination with two limits per request:
        - Maximum 1000 rows per response
        - Maximum 1MB of row data per response

        The response stops at whichever limit is reached first.

        Requires admin or viewer role.
      operationId: getQueryRows
      parameters:
        - name: cursor
          in: query
          description: Pagination cursor from previous response
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of rows to return
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        '200':
          description: Query rows retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryRowsResponse'
        '400':
          description: Invalid cursor or limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /audit:
    get:
      tags:
        - Audit
      summary: List audit events
      description: |
        Returns a list of audit log events.

        Requires admin or viewer role.
      operationId: listAudit
      parameters:
        - name: event_type
          in: query
          description: Filter by event type (e.g., user.created, grant.revoked)
          schema:
            type: string
        - name: user_id
          in: query
          description: Filter by user UID (the user being acted upon)
          schema:
            type: string
            format: uuid
        - name: performed_by
          in: query
          description: Filter by performer UID (the user performing the action)
          schema:
            type: string
            format: uuid
        - name: start_time
          in: query
          description: Filter by start time (RFC3339 format)
          schema:
            type: string
            format: date-time
        - name: end_time
          in: query
          description: Filter by end time (RFC3339 format)
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: List of audit events
          content:
            application/json:
              schema:
                type: object
                properties:
                  audit_events:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /audit/verify:
    get:
      tags:
        - Audit
      summary: Verify the audit chain (admin only)
      description: |
        Walks the store-wide HMAC audit chain oldest to newest and reports the
        first record that does not add up, together with the chain head.

        **This is not equivalent to `dbbat audit verify`.** The CLI runs where
        the key lives and can be run by someone who does not trust the running
        server; this endpoint is served *by* that server, so a compromised or
        modified dbbat can answer `"verified": true` without walking anything.
        The answer is also cached (see below), so it can be up to 60 seconds
        old: a chain broken moments ago keeps reporting `"verified": true`
        until the cached walk expires. This is a monitoring signal, not a
        point-in-time attestation.

        Use it for routine evidence collection, and the CLI (or an independent
        re-run of it) when the integrity of the process itself is in question.

        Record `head_mac` outside the database. A chain always verifies against
        itself, so truncating and re-sealing it with a stolen key is invisible
        from the inside; comparing today's head against the one recorded last
        quarter is what closes that hole.

        `unverifiable_pre_anchor_entries` counts rows written before chaining
        was introduced. Nothing sealed them, and nothing can after the fact.

        The response never contains the chain key, and never contains the
        content of any audited record.

        A full walk is O(rows), so the outcome of a walk is cached for a minute
        (`cached` says whether this answer was reused, `checked_at` when it was
        computed) and at most one walk runs at a time per instance.

        Requires admin role.
      operationId: verifyAuditChain
      responses:
        '200':
          description: Verification outcome
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditChainVerification'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: This instance has no chain key, so nothing it stores is chained
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /audit/verify/queries:
    get:
      tags:
        - Audit
      summary: Verify the per-connection query chains (admin only)
      description: |
        Walks the query chain of every connection that has one, or of a single
        session when `connection` is given. A scoped walk additionally reports
        that chain's head.

        `chains_with_truncated_prefix` counts chains missing their oldest
        statements — what `DBB_QUERY_STORAGE_RETENTION` leaves behind on a
        long-lived session. That is expected housekeeping, not tampering, and
        everything after the truncation is still verified.

        `legacy_stamps` counts sessions still carrying the pre-0.24 head stamp,
        which is a verbatim copy of the last statement's MAC and therefore
        forgeable by anyone who can write to the store. Those chains verified;
        what is missing is a keyed confirmation that nothing was removed from
        their end. Sessions closed by this build are sealed, so the number
        drains as the old ones age out.

        The same caveats as `GET /audit/verify` apply: an answer from the
        server is only as trustworthy as the server, and it is cached, so it
        can be up to 60 seconds old — a chain broken moments ago keeps
        reporting `"verified": true` until the cached walk expires. The
        response never contains the chain key, and never contains SQL text,
        parameters or any other statement content.

        Requires admin role.
      operationId: verifyQueryChains
      parameters:
        - name: connection
          in: query
          description: Verify only this connection's chain
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Verification outcome
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryChainVerification'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: This instance has no chain key, so nothing it stores is chained
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /servers/{uid}/connection:
    get:
      tags:
        - Databases
      summary: Get connection URL template for a database
      description: |
        Returns a connection URL with `{DBBAT_KEY}` placeholder for the specified database.
        - Admin callers: always 200.
        - Non-admin callers: 200 if they have at least one active grant; 404 otherwise (to avoid leaking database existence).
        - If the protocol proxy is disabled (resolved port = 0): returns 409.
      operationId: getDatabaseConnection
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Connection URL template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Protocol proxy is disabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          $ref: '#/components/responses/InternalError'

  /servers/{uid}/test:
    post:
      tags:
        - Databases
      summary: Test that a server is actually reachable and usable (admin only)
      description: |
        Validates a server row by dialing it for real, so provisioning is not write-and-hope.

        - `protocol: ssh` rows: dials the bastion (through its own `via_uid` chain when set),
          completes the SSH handshake with the stored key or password, and — on the first
          success — pins the presented host key into `ssh_known_host_key`, so TOFU pinning
          happens under admin supervision rather than implicitly on a user's first query.
        - Database rows: dials the target (through the bastion when `via_uid` is set) and
          performs a real protocol-level login with the stored credentials — PostgreSQL,
          MySQL / MariaDB, MongoDB and Oracle are all probed. A protocol dbbat has no probe
          for would be reported reachability-only, with code `auth_not_verified`.
          An Oracle row with neither `oracle_service_name` nor `database_name` cannot be
          probed at all and reports `stage: config`, `code: missing_config`.

        A failed check is still HTTP 200 with `ok: false` — the staged result *is* the answer.
        `stage` and `code` tell the admin which field is wrong. No credential or key material is
        ever returned.
      operationId: testServerConnection
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Connectivity check result (successful or failed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionTestResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /ssh-servers:
    get:
      tags:
        - Databases
      summary: List SSH bastion servers (admin only)
      description: |
        Returns SSH bastion rows (protocol `ssh`). These are excluded from the
        regular database listing and every grantable/connectable target
        context; they appear only here, for management and the "via SSH server"
        selector. Secrets (private key, passphrase) are never returned.
      operationId: listSSHServers
      security:
        - basicAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: List of SSH servers
          content:
            application/json:
              schema:
                type: object
                properties:
                  servers:
                    type: array
                    items:
                      $ref: '#/components/schemas/Database'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /tunnel-servers:
    get:
      tags:
        - Databases
      summary: List tunnel (dial-path) servers (admin only)
      description: |
        Returns every dial-path row — SSH bastions (`ssh`) and Kubernetes
        clusters (`kubernetes`) — for a target's "via" selector. These rows are
        excluded from the regular database listing and from every
        grantable/connectable target context. Secrets (SSH private key and
        passphrase, ServiceAccount token) are never returned.
      operationId: listTunnelServers
      security:
        - basicAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: List of tunnel servers
          content:
            application/json:
              schema:
                type: object
                properties:
                  servers:
                    type: array
                    items:
                      $ref: '#/components/schemas/Database'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /parameters:
    get:
      tags:
        - Parameters
      summary: List all active parameters
      description: Returns all active global parameters. Admin-only. Optional `group_key` query filter.
      operationId: listParameters
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: group_key
          in: query
          description: Filter by group key
          schema:
            type: string
      responses:
        '200':
          description: List of parameters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GlobalParameter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /parameters/{group}/{key}:
    get:
      tags:
        - Parameters
      summary: Get a single parameter
      operationId: getParameter
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: group
          in: path
          required: true
          schema:
            type: string
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalParameter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
        - Parameters
      summary: Create or update a parameter
      operationId: setParameter
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: group
          in: path
          required: true
          schema:
            type: string
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetParameterRequest'
      responses:
        '200':
          description: Updated parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalParameter'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - Parameters
      summary: Delete a parameter
      operationId: deleteParameter
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: group
          in: path
          required: true
          schema:
            type: string
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Parameter deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /instance:
    get:
      tags:
        - Instance
      summary: Get instance information
      description: Returns listen addresses, public endpoint settings, and resolved connection info. Any authenticated user can call this endpoint; non-admins receive only `listen` and `resolved`.
      operationId: getInstance
      security:
        - basicAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Instance information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /instance/public:
    put:
      tags:
        - Instance
      summary: Update public endpoint settings
      description: Atomically upserts all public.* parameters. Admin-only.
      operationId: updateInstancePublic
      security:
        - basicAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicEndpoints'
      responses:
        '204':
          description: Settings saved
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /mcp:
    post:
      tags:
        - MCP
      summary: Model Context Protocol endpoint (Streamable HTTP)
      description: |
        MCP endpoint for AI agents. This is **not a REST endpoint** — it speaks
        JSON-RPC 2.0 over the MCP Streamable HTTP transport — but it is
        documented here because it is part of the authenticated API surface and
        shares its authentication.

        Point any MCP-capable client at
        `https://<dbbat>/api/v1/mcp` with an `Authorization: Bearer dbb_…`
        header. Registered only when `DBB_MCP_ENABLED` is true (the default).

        **Authentication is API-key only.** Basic Auth and browser session
        tokens are refused with `403`: the key is not merely the caller's
        credential here, it is also the password the loopback protocol client
        authenticates to the proxy with.

        **Execution model.** Every statement the agent runs is executed by
        dialing dbbat's own PostgreSQL or MySQL proxy listener over loopback as
        the API key's owner. There is no internal execution path, so grants,
        `read_only` / `block_ddl` / `block_copy`, quotas, query logging, session
        capture and approval holds all apply unchanged. Phase 1 covers
        PostgreSQL and MySQL/MariaDB; Oracle, MongoDB and SQL Server report
        `supported: false` in `list_databases`.

        **Session model.** The server runs stateless: no `Mcp-Session-Id`, each
        request re-authenticated, so a revoked key stops working on the next
        call.

        **Tools.**

        | Tool | Purpose |
        |---|---|
        | `list_databases` | databases the caller holds an active grant on, with expiry, controls and quota usage |
        | `query` | run one statement — `{database, sql, params?, max_rows?}`; rows are capped server-side |
        | `describe` | list tables, or the columns of one table |
        | `await_approval` | wait for a statement suspended by an approval hold |

        **Approval holds.** A held statement blocks the wire connection. If it
        is still parked after a short grace window, `query` returns
        `status: "approval_pending"` with an `execution_id` and the held
        `query_uid`, while the loopback connection stays parked in the
        background; `await_approval` long-polls that execution. The agent never
        silently times out — every result names the next action.

        See `docs/mcp.md`.
      operationId: mcpEndpoint
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MCPMessage'
      responses:
        '200':
          description: |
            JSON-RPC response, as `application/json` or as an
            `text/event-stream` SSE body depending on what the client accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPMessage'
            text/event-stream:
              schema:
                type: string
        '202':
          description: Notification or response accepted with no body
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Authenticated, but not with an API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: MCP is disabled on this instance
        '413':
          description: Request body too large
    get:
      tags:
        - MCP
      summary: MCP server-to-client stream (not served)
      description: |
        Part of the MCP Streamable HTTP transport. dbbat runs the server
        stateless, so there is no long-lived server→client stream to open and
        this always answers `405`. It is registered so a client's transport
        probe gets the protocol's own answer instead of a `404` it has to guess
        at.
      operationId: mcpStream
      security:
        - bearerAuth: []
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          description: Not supported by a stateless MCP server
    delete:
      tags:
        - MCP
      summary: Terminate an MCP session (not served)
      description: |
        Part of the MCP Streamable HTTP transport. There are no sessions to
        terminate on a stateless server, so this always answers `405`.
      operationId: mcpDeleteSession
      security:
        - bearerAuth: []
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          description: Not supported by a stateless MCP server

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication (username:password)
    bearerAuth:
      type: http
      scheme: bearer
      description: API key authentication (Bearer token)

  parameters:
    UserUID:
      name: uid
      in: path
      required: true
      description: User UID
      schema:
        type: string
        format: uuid

    DatabaseUID:
      name: uid
      in: path
      required: true
      description: Database UID
      schema:
        type: string
        format: uuid

    GrantUID:
      name: uid
      in: path
      required: true
      description: Grant UID
      schema:
        type: string
        format: uuid

    ConnectionUID:
      name: uid
      in: path
      required: true
      description: Connection UID
      schema:
        type: string
        format: uuid

    QueryUID:
      name: uid
      in: path
      required: true
      description: Query UID
      schema:
        type: string
        format: uuid

    Limit:
      name: limit
      in: query
      description: Maximum number of results to return
      schema:
        type: integer
        default: 100
        minimum: 1
        maximum: 1000

    Offset:
      name: offset
      in: query
      description: Number of results to skip for pagination
      schema:
        type: integer
        default: 0
        minimum: 0

  schemas:
    # Version schemas
    VersionInfo:
      type: object
      description: API and build version information
      properties:
        api_version:
          type: string
          description: API version (e.g., "v1")
          example: v1
        build_version:
          type: string
          description: Build version
          example: 1.2.3
        build_commit:
          type: string
          description: Git commit hash
          example: abc1234
        build_time:
          type: string
          format: date-time
          description: Build timestamp
          example: "2026-01-09T12:00:00Z"
        run_mode:
          type: string
          description: |
            Run mode of the server. Empty string for production, "test" for test mode, "demo" for demo mode.
          example: ""
      required:
        - api_version
        - build_version
        - build_commit
        - build_time
        - run_mode

    # Auth schemas
    LoginRequest:
      type: object
      properties:
        username:
          type: string
          description: Username
        password:
          type: string
          format: password
          description: Password
      required:
        - username
        - password

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: Web session token (use as Bearer token)
        expires_at:
          type: string
          format: date-time
          description: Token expiration time
        user:
          $ref: '#/components/schemas/AuthUser'
      required:
        - token
        - expires_at
        - user

    AuthUser:
      type: object
      description: User info returned in auth responses
      properties:
        uid:
          type: string
          format: uuid
          description: User UID
        username:
          type: string
          description: Username
        roles:
          type: array
          items:
            type: string
            enum: [admin, viewer, connector]
          description: User roles
        password_change_required:
          type: boolean
          description: Whether user must change their password
      required:
        - uid
        - username
        - roles
        - password_change_required

    MeResponse:
      type: object
      properties:
        uid:
          type: string
          format: uuid
          description: User UID
        username:
          type: string
          description: Username
        roles:
          type: array
          items:
            type: string
            enum: [admin, viewer, connector]
          description: User roles
        password_change_required:
          type: boolean
          description: Whether user must change their password
        session:
          $ref: '#/components/schemas/SessionInfo'
      required:
        - uid
        - username
        - roles
        - password_change_required
        - session

    SessionInfo:
      type: object
      description: Current session information
      properties:
        expires_at:
          type: string
          format: date-time
          description: Session expiration time
        created_at:
          type: string
          format: date-time
          description: Session creation time

    ChangePasswordRequest:
      type: object
      description: Request for authenticated password change (re-authentication required)
      properties:
        username:
          type: string
          description: Username for re-authentication
        current_password:
          type: string
          format: password
          description: Current password for re-authentication
        new_password:
          type: string
          format: password
          description: New password (minimum 8 characters)
      required:
        - username
        - current_password
        - new_password

    PreLoginPasswordChangeRequest:
      type: object
      description: Request for pre-login password change (no token required)
      properties:
        username:
          type: string
          description: Username
        current_password:
          type: string
          format: password
          description: Current/temporary password
        new_password:
          type: string
          format: password
          description: New password (minimum 8 characters)
      required:
        - username
        - current_password
        - new_password

    ResetPasswordRequest:
      type: object
      description: Request for admin password reset (web session required)
      properties:
        new_password:
          type: string
          format: password
          minLength: 8
          description: New password for the user (minimum 8 characters)
      required:
        - new_password

    # User schemas
    User:
      type: object
      properties:
        uid:
          type: string
          format: uuid
          description: Unique identifier
        username:
          type: string
          description: Username
        roles:
          type: array
          items:
            type: string
            enum: [admin, viewer, connector]
          description: User roles
        rate_limit_exempt:
          type: boolean
          description: Whether user bypasses rate limiting
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp
      required:
        - uid
        - username
        - roles
        - rate_limit_exempt
        - created_at
        - updated_at

    CreateUserRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          description: Username
        password:
          type: string
          minLength: 1
          description: Password
        roles:
          type: array
          items:
            type: string
            enum: [admin, viewer, connector]
          description: User roles
      required:
        - username
        - password

    UserGroup:
      type: object
      description: |
        Organizational grouping of users, used to scope grant definitions.
        Distinct from `roles`, which are functional (admin/viewer/connector).
      properties:
        uid:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 64
        description:
          type: string
        member_uids:
          type: array
          items:
            type: string
            format: uuid
          description: UIDs of the users belonging to this group.
        created_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - uid
        - name
        - description
        - member_uids
        - created_at

    CreateUserGroupRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 64
        description:
          type: string
        member_uids:
          type: array
          items:
            type: string
            format: uuid
          description: |
            Replaces the group's membership. On update, omit to leave
            membership untouched; an explicit empty array empties the group.
      required:
        - name

    ServerGroup:
      type: object
      description: |
        A named set of database servers — the unit rights are scoped on.
        Membership is **live**: a grant bound to this group covers whatever the
        group contains right now, so adding a server widens every live grant
        bound to it the instant it is saved.
      properties:
        uid:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 64
        description:
          type: string
        member_uids:
          type: array
          items:
            type: string
            format: uuid
          description: UIDs of the servers belonging to this group.
        active_grant_count:
          type: integer
          format: int64
          readOnly: true
          description: |
            How many currently-authorizing grants are bound to this group —
            the blast radius of a membership edit, since membership is live.
        created_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - uid
        - name
        - description
        - member_uids
        - active_grant_count
        - created_at

    CreateServerGroupRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 64
        description:
          type: string
        member_uids:
          type: array
          items:
            type: string
            format: uuid
          description: |
            Replaces the group's membership. On update, omit to leave
            membership untouched; an explicit empty array empties the group.
            SSH bastions are rejected.
      required:
        - name

    UpdateUserRequest:
      type: object
      properties:
        password:
          type: string
          description: New password
        roles:
          type: array
          items:
            type: string
            enum: [admin, viewer, connector]
          description: New roles (admin only)
        user_group_uids:
          type: array
          items:
            type: string
            format: uuid
          description: |
            Replaces the user's user-group memberships wholesale (admin only).
            Omit to leave membership untouched.
        group_uids:
          type: array
          deprecated: true
          items:
            type: string
            format: uuid
          description: |
            **Deprecated** pre-rename spelling of `user_group_uids`, still
            accepted on input for one release so existing clients keep
            working. `user_group_uids` wins when both are present; responses
            never emit this name.

    # Database schemas
    Database:
      type: object
      description: Full database details (admin only)
      properties:
        uid:
          type: string
          format: uuid
          description: Unique identifier
        name:
          type: string
          description: Database configuration name
        description:
          type: string
          description: Description
        host:
          type: string
          description: Target database host
        port:
          type: integer
          description: Target database port
        database_name:
          type: string
          description: Target database name
        username:
          type: string
          description: Target database username
        ssl_mode:
          type: string
          description: SSL mode (disable, prefer, require, etc.)
        protocol:
          type: string
          enum: [postgresql, oracle, mysql, mariadb, mongodb, mssql, ssh, kubernetes]
          description: >-
            Server protocol. `ssh` and `kubernetes` are dial paths, not database
            targets: they are never grantable, never listable, and exist only to
            be referenced by another row's `via_uid`.
        oracle_service_name:
          type: string
          description: Oracle SERVICE_NAME (Oracle only)
        mongo_auth_source:
          type: string
          description: Upstream MongoDB SCRAM authSource (MongoDB only; defaults to "admin")
        listable:
          type: boolean
          default: true
          description: Whether this database appears in the grant-request dropdown for non-admin users
        created_by:
          type: string
          format: uuid
          nullable: true
          description: User who created this configuration
        via_uid:
          type: string
          format: uuid
          nullable: true
          description: >-
            Tunnel row (`ssh` bastion or `kubernetes` cluster) UID to dial
            through; null for a direct dial. When it points at a `kubernetes`
            row, `host` addresses a pod (`<pod-name>`) or a service
            (`svc/<name>`) **inside that row's namespace** and `port` is the
            container port — a port-forward reaches a pod's own port and
            nothing else, so a database merely routable from the cluster
            network is out of scope.
        ssh_known_host_key:
          type: string
          description: TOFU-pinned SSH bastion host key (read-only; ssh servers only)
        k8s_ca_cert:
          type: string
          description: >-
            PEM CA bundle of the Kubernetes API server (kubernetes servers only).
            Public challenge material, so it round-trips; the ServiceAccount
            token never does.
        k8s_namespace:
          type: string
          description: Namespace every lookup and port-forward is scoped to (kubernetes servers only)
        k8s_insecure_skip_tls_verify:
          type: boolean
          description: Whether API server certificate verification is disabled (kubernetes servers only)
        connection_test:
          allOf:
            - $ref: '#/components/schemas/ConnectionTestResult'
          description: >-
            Present only when the create/update request set `test_connection: true`
      required:
        - uid
        - name

    ConnectionTestResult:
      type: object
      description: |
        Staged outcome of a connectivity check. Carries no secret material: only the stage
        reached, a machine-readable code, a human-readable message, and the bastion's public
        host key.
      properties:
        ok:
          type: boolean
          description: Whether the check succeeded end to end
        stage:
          type: string
          enum:
            - config
            - bastion_dial
            - bastion_auth
            - target_dial
            - target_auth
            - cluster_api
            - cluster_auth
            - cluster_rbac
            - cluster_target
          description: |
            How far the check got. On failure this is the stage that failed, which is what tells
            the admin which field they got wrong:
            - `config`: the row is unusable before any packet is sent (no credentials, unparseable key, via_uid cycle)
            - `bastion_dial`: the SSH bastion could not be reached (DNS, routing, firewall)
            - `bastion_auth`: the SSH handshake failed (host-key mismatch or rejected credentials)
            - `target_dial`: the database target could not be reached (through the tunnel when via_uid is set)
            - `target_auth`: the database handshake or login failed
            - `cluster_api`: the Kubernetes API server could not be reached (DNS, routing, firewall, untrusted CA)
            - `cluster_auth`: the API server rejected the ServiceAccount token
            - `cluster_rbac`: authenticated, but not allowed to create `pods/portforward` in the namespace
            - `cluster_target`: the addressed pod (or the ready pod behind `svc/<name>`) does not resolve or is not Ready
        code:
          type: string
          enum:
            - ok
            - dns_failure
            - timeout
            - unreachable
            - host_key_mismatch
            - auth_rejected
            - bad_private_key
            - no_auth_method
            - missing_config
            - via_cycle
            - via_not_ssh
            - handshake_failed
            - db_auth_failed
            - db_handshake_failed
            - auth_not_verified
            - k8s_forbidden
            - k8s_target_not_found
            - k8s_target_not_ready
            - internal_error
          description: Machine-readable classification within the stage; `ok` on success
        message:
          type: string
          description: Human-readable explanation, safe to display to an admin
        host_key_pinned:
          type: boolean
          description: True when this check performed the TOFU pin (first successful connect to a bastion)
        ssh_known_host_key:
          type: string
          description: The bastion's public host key after the check (ssh servers only)
        duration_ms:
          type: integer
          format: int64
          description: How long the check took, in milliseconds
      required:
        - ok
        - stage
        - code
        - message
        - duration_ms

    DatabaseLimited:
      type: object
      description: Limited database info for non-admin users
      properties:
        uid:
          type: string
          format: uuid
          description: Unique identifier
        name:
          type: string
          description: Database configuration name
        description:
          type: string
          description: Description
      required:
        - uid
        - name

    CreateDatabaseRequest:
      type: object
      properties:
        name:
          type: string
          description: Unique name for this database configuration
        description:
          type: string
          description: Description
        host:
          type: string
          description: Target database host
        port:
          type: integer
          default: 5432
          description: Target database port
        database_name:
          type: string
          description: Target database name
        username:
          type: string
          description: Target database username
        password:
          type: string
          description: Target database password (encrypted at rest)
        ssl_mode:
          type: string
          default: prefer
          description: SSL mode
        protocol:
          type: string
          enum: [postgresql, oracle, mysql, mariadb, mongodb, mssql, ssh, kubernetes]
          default: postgresql
          description: >-
            Server protocol. `ssh` and `kubernetes` are dial paths, not database
            targets: they are never grantable, never listable, and exist only to
            be referenced by another row's `via_uid`.
        oracle_service_name:
          type: string
          description: Oracle SERVICE_NAME (required for Oracle)
        mongo_auth_source:
          type: string
          description: Upstream MongoDB SCRAM authSource (MongoDB only; defaults to "admin")
        listable:
          type: boolean
          default: true
          description: Whether this database appears in the grant-request dropdown for non-admin users
        via_uid:
          type: string
          format: uuid
          nullable: true
          description: >-
            Tunnel row (`ssh` bastion or `kubernetes` cluster) UID to dial
            through; null for a direct dial. When it points at a `kubernetes`
            row, `host` addresses a pod (`<pod-name>`) or a service
            (`svc/<name>`) **inside that row's namespace** and `port` is the
            container port — a port-forward reaches a pod's own port and
            nothing else, so a database merely routable from the cluster
            network is out of scope.
        ssh_private_key:
          type: string
          description: SSH private key (PEM) for an ssh server; write-only, never returned
        ssh_passphrase:
          type: string
          description: Passphrase for the SSH private key; write-only, never returned
        k8s_ca_cert:
          type: string
          description: >-
            PEM CA bundle of the Kubernetes API server. Required for a
            `kubernetes` row unless `k8s_insecure_skip_tls_verify` is set.
        k8s_namespace:
          type: string
          description: >-
            Namespace the ServiceAccount's Role covers; every pod/service lookup
            and every port-forward is scoped to it. Required for a `kubernetes` row.
        k8s_insecure_skip_tls_verify:
          type: boolean
          description: >-
            Disable API server certificate verification. For throwaway clusters
            only: with it set, anything that can intercept the API server
            connection can read the ServiceAccount token.
        test_connection:
          type: boolean
          description: |
            Optional; defaults to false when omitted. When true, the API dials the newly created
            row once and returns the staged outcome as `connection_test` in the response.
            Never fatal: the row is created either way.
      required:
        - name
        - host
        - username

    UpdateDatabaseRequest:
      type: object
      properties:
        description:
          type: string
          description: Description
        host:
          type: string
          description: Target database host
        port:
          type: integer
          description: Target database port
        database_name:
          type: string
          description: Target database name
        username:
          type: string
          description: Target database username
        password:
          type: string
          description: Target database password (encrypted at rest)
        ssl_mode:
          type: string
          description: SSL mode
        protocol:
          type: string
          enum: [postgresql, oracle, mysql, mariadb, mongodb, mssql, ssh, kubernetes]
          description: Server protocol
        oracle_service_name:
          type: string
          description: Oracle SERVICE_NAME
        mongo_auth_source:
          type: string
          description: Upstream MongoDB SCRAM authSource (MongoDB only; defaults to "admin")
        listable:
          type: boolean
          description: Whether this database appears in the grant-request dropdown for non-admin users
        via_uid:
          type: string
          format: uuid
          nullable: true
          description: >-
            Tunnel row (`ssh` bastion or `kubernetes` cluster) UID to dial
            through; null for a direct dial. When it points at a `kubernetes`
            row, `host` addresses a pod (`<pod-name>`) or a service
            (`svc/<name>`) **inside that row's namespace** and `port` is the
            container port — a port-forward reaches a pod's own port and
            nothing else, so a database merely routable from the cluster
