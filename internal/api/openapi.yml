openapi: 3.0.3
info:
  title: DBBat API
  description: |
    REST API for DBBat Database Observability Proxy.

    DBBat is a transparent PostgreSQL proxy for query observability, access control, and safety.

    ## Authentication

    The API supports two authentication methods:

    - **Basic Auth**: HTTP Basic Authentication using username and password
    - **Bearer Token**: API key authentication using `Authorization: Bearer <api-key>`

    API keys cannot create or revoke other API keys (security restriction) - these operations require Basic Auth.

    ## Roles

    Users have one or more roles that determine their access:

    - **admin**: Full access to all resources and operations
    - **viewer**: Read-only access to observability data (connections, queries, audit)
    - **connector**: Can only access databases they have active grants for

    ## Password Change Requirement

    Users must change their initial password before logging in.
    Login attempts from users who haven't changed their password will receive a `403 Forbidden` response with error code `PASSWORD_CHANGE_REQUIRED`.
    Users must then call `PUT /auth/password` with their username and credentials to change their password before they can log in.

    ## Rate Limiting

    Every endpoint is rate limited and may answer `429` with the standard
    `Error` body (`code: RATE_LIMITED`) and a `Retry-After` header. Because
    that is true everywhere, it is documented per-operation only where the
    client must *branch* on it rather than simply retry — the
    session-validation endpoints under `/auth`, where mistaking a `429` for
    an invalid session or a bad password is a bug.

    Response headers include:

    - `X-RateLimit-Limit`: Maximum requests per minute
    - `X-RateLimit-Remaining`: Remaining requests in current window
    - `X-RateLimit-Reset`: Unix timestamp when limit resets

    ## Authentication Rate Limiting

    Failed login attempts are rate-limited per username with exponential backoff:

    - 1-2 failures: no delay
    - 3-4 failures: 5 seconds
    - 5-6 failures: 30 seconds
    - 7-9 failures: 2 minutes
    - 10+ failures: 5 minutes

    Rate-limited authentication attempts receive a `429 Too Many Requests` response with error code `auth_rate_limited`.
  version: 1.0.0
  contact:
    name: DBBat

servers:
  - url: /api/v1
    description: API v1 server

tags:
  - name: Health
    description: Health check endpoint
  - name: Version
    description: Version and build information
  - name: Auth
    description: Authentication (login, logout, session management)
  - name: Users
    description: User management
  - name: User Groups
    description: Organizational user groups used to scope grant definitions
  - name: Server Groups
    description: |
      Named sets of database servers — the unit rights are scoped on. A grant
      definition targets server groups instead of enumerating servers, and a
      grant binds to one, so adding a server to a group extends every live
      grant bound to it. Membership is deliberately **live**, never
      snapshotted.
  - name: Databases
    description: Database configuration management
  - name: Grants
    description: Access grant management
  - name: API Keys
    description: API key management
  - name: Connections
    description: Connection observability
  - name: Queries
    description: Query observability
  - name: Audit
    description: Audit log
  - name: MCP
    description: Model Context Protocol endpoint for AI agents

security:
  - basicAuth: []
  - bearerAuth: []

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: Returns the health status of the API server and database connection.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
        '503':
          description: Service is unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /version:
    get:
      tags:
        - Version
      summary: Get version information
      description: Returns API version and build information.
      operationId: getVersion
      security: []
      responses:
        '200':
          description: Version information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionInfo'

  /auth/login:
    post:
      tags:
        - Auth
      summary: Login and create web session
      description: |
        Authenticates with username/password and creates a short-lived web session token.

        The token should be stored and used as a Bearer token for subsequent API calls.
        Web session tokens expire after 1 hour.

        **Important**: Users who haven't changed their initial password will receive a 403 error.
        They must first change their password using `PUT /auth/password` before logging in.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Password change required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/AuthRateLimited'

  /auth/logout:
    post:
      tags:
        - Auth
      summary: Logout and revoke web session
      description: |
        Revokes the current web session token.

        After logout, the token will no longer be valid for authentication.
      operationId: logout
      responses:
        '204':
          description: Logout successful
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/me:
    get:
      tags:
        - Auth
      summary: Get current user and session info
      description: |
        Returns information about the currently authenticated user and their session.

        Use this endpoint to:
        - Validate that a session token is still valid
        - Check if password change is required
        - Get session expiration time

        Like every authenticated endpoint, this one is rate limited per user
        and can answer `429`. A `429` says nothing about the token: clients
        must keep the session and retry after `Retry-After`, not treat it as
        an invalid session.
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user and session info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/password:
    put:
      tags:
        - Auth
      summary: Change password (pre-login)
      description: |
        Allows users to change their password before logging in.
        Used for initial password change or password reset flows.

        Does not require authentication - validates username/current_password.
        Subject to rate limiting (same as login).

        After changing password, users can login using `POST /auth/login`.
      operationId: changePasswordPreLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreLoginPasswordChangeRequest'
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Weak password
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum: [weak_password]
                  message:
                    type: string
                required:
                  - error
                  - message
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/AuthRateLimited'

  /auth/providers:
    get:
      tags:
        - Auth
      summary: List authentication providers
      description: Returns enabled authentication methods. Used by the frontend to show login options.
      operationId: listAuthProviders
      security: []
      responses:
        '200':
          description: List of auth providers
          content:
            application/json:
              schema:
                type: object
                properties:
                  providers:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          enum: [password, slack, oidc]
                        enabled:
                          type: boolean
                        authorize_url:
                          type: string
                          description: URL to initiate OAuth flow (only for OAuth providers)
                        display_name:
                          type: string
                          description: >
                            Login-button label for providers whose branding is
                            operator-configured (the generic OIDC provider,
                            DBB_OIDC_DISPLAY_NAME). Absent for providers the
                            frontend labels itself, such as Slack.

  /auth/oidc:
    get:
      tags:
        - Auth
      summary: Initiate generic OIDC login
      description: >
        Redirects to the configured OpenID Connect issuer's authorization
        endpoint (with an S256 PKCE challenge). Registered only when
        DBB_OIDC_ISSUER is set.
      operationId: initiateOIDCAuth
      security: []
      parameters:
        - in: query
          name: redirect
          schema:
            type: string
          description: URL to redirect to after successful login
      responses:
        '302':
          description: Redirect to the issuer's authorization endpoint

  /auth/oidc/callback:
    get:
      tags:
        - Auth
      summary: Generic OIDC callback
      description: >
        Handles the redirect back from the OIDC issuer. Verifies the ID token
        against the issuer's JWKS, applies the optional email-domain
        allowlist, creates or links the user, creates a session and redirects
        to the app.
      operationId: oidcAuthCallback
      security: []
      parameters:
        - in: query
          name: code
          schema:
            type: string
        - in: query
          name: state
          schema:
            type: string
      responses:
        '302':
          description: Redirect to app with a one-time login exchange code

  /auth/slack:
    get:
      tags:
        - Auth
      summary: Initiate Slack OAuth login
      description: Redirects to Slack's authorization page. After approval, Slack redirects back to the callback endpoint.
      operationId: initiateSlackAuth
      security: []
      parameters:
        - in: query
          name: redirect
          schema:
            type: string
          description: URL to redirect to after successful login
      responses:
        '302':
          description: Redirect to Slack authorization

  /auth/slack/callback:
    get:
      tags:
        - Auth
      summary: Slack OAuth callback
      description: Handles the redirect from Slack after authorization. Creates or links user, creates session, redirects to app.
      operationId: slackAuthCallback
      security: []
      parameters:
        - in: query
          name: code
          schema:
            type: string
        - in: query
          name: state
          schema:
            type: string
      responses:
        '302':
          description: Redirect to app with session token

  /auth/device:
    post:
      tags:
        - Auth
      summary: Device authorization request (RFC 8628)
      description: |
        Starts an OAuth 2.0 Device Authorization Grant (RFC 8628). Lets an
        external tool (CLI or desktop app) obtain an API key through a browser
        approval instead of manual copy/paste.

        The client opens `verification_uri_complete` in a browser (or shows the
        user `verification_uri` + `user_code`, e.g. over SSH); a logged-in user
        approves or denies it there. The client then polls
        `POST /auth/device/token` with `device_code` until it resolves.

        Unauthenticated — opening a request grants nothing by itself.

        Note: `client_name` is a dbbat extension used as the consent-page label;
        `client_id` is accepted for OAuth compatibility but ignored (dbbat is
        not a multi-client authorization server). Bodies are JSON rather than
        RFC 8628's form-encoding, matching the rest of the dbbat API.
      operationId: deviceAuthorization
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceAuthorizationRequest'
      responses:
        '200':
          description: Device authorization request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAuthorizationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/device/token:
    post:
      tags:
        - Auth
      summary: Device token endpoint (RFC 8628)
      description: |
        The RFC 8628 token endpoint. The client polls it with the
        `device_code`; it answers with a standard OAuth error while the request
        is pending and a Bearer token once approved.

        Error responses use the OAuth `{error, error_description}` shape (a
        deliberate deviation from dbbat's usual `{code, message}` envelope):
        `authorization_pending` (still waiting), `access_denied` (user denied),
        `expired_token` (unknown/expired device_code — also returned once a
        result has already been delivered, since it's consumed on read), and
        `unsupported_grant_type`.

        Unauthenticated — the `device_code` itself is the capability.
      operationId: deviceToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceTokenRequest'
      responses:
        '200':
          description: Authorization approved; access token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceTokenResponse'
        '400':
          description: |
            Pending or errored, as an OAuth error object. `error` is one of
            `authorization_pending`, `access_denied`, `expired_token`,
            `unsupported_grant_type`, `invalid_request`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/oauth/exchange:
    post:
      tags:
        - Auth
      summary: Redeem a one-time OAuth login code for a web session token
      description: |
        The OAuth callback never puts a session token in a URL: it redirects
        the browser to the login page with a short-lived, single-use `code`
        instead. The SPA posts that code here and gets the actual `web_`
        session token back in the response body.

        Unauthenticated — the code itself is the capability — but the code is
        consumed on first use, expires within minutes, and the endpoint is IP
        rate limited.
      operationId: oauthExchange
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginExchangeRequest'
      responses:
        '200':
          description: Code redeemed; web session token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginExchangeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: The code is unknown, already redeemed or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/device/consent:
    get:
      tags:
        - Auth
      summary: Get device authorization consent details
      description: |
        Returns the public details (client name, user code, status) of a
        pending or resolved device authorization request, for the consent page
        to render. Looked up by `user_code` (case-insensitive, dashes optional).
        Never returns the device code or the minted key.
      operationId: getDeviceConsent
      parameters:
        - name: user_code
          in: query
          required: true
          description: The user code shown to the user (case-insensitive, dashes optional)
          schema:
            type: string
      responses:
        '200':
          description: Device authorization consent details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceConsentInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags:
        - Auth
      summary: Approve or deny a device authorization request
      description: |
        Approves or denies a pending device authorization request, keyed by
        `user_code`. On approval, mints a real API key owned by the approving
        user, exactly as `POST /keys` would.

        Requires Web Session or Basic Auth (API keys cannot perform this
        operation, same restriction as direct API key creation).
      operationId: deviceConsent
      security:
        - basicAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceConsentRequest'
      responses:
        '204':
          description: Response recorded
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /slack/interactions:
    post:
      tags:
        - Auth
      summary: Slack interactivity webhook
      description: |
        Receives Slack Block Kit interaction callbacks (Approve / Deny button
        clicks on grant-request notifications). Authenticated by the Slack
        request signature (`X-Slack-Signature` / `X-Slack-Request-Timestamp`
        verified with the app signing secret), not a bearer token.

        Slack sends `application/x-www-form-urlencoded` with a single
        `payload` field containing the interaction JSON. The endpoint acks
        with `200` immediately (Slack's 3-second deadline) and processes the
        decision asynchronously; all user feedback is delivered back to Slack
        (message update, thread reply, or ephemeral message). Only registered
        when `DBB_SLACK_SIGNING_SECRET` is configured.
      operationId: slackInteractions
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                payload:
                  type: string
                  description: URL-encoded JSON interaction callback from Slack.
              required:
                - payload
      responses:
        '200':
          description: |
            Acknowledged. Returned for valid interactions (processed
            asynchronously) and for ignored ones (unknown action, non-UUID
            value) alike — an empty body so Slack shows the user nothing.
        '401':
          description: |
            Signature verification failed — missing/invalid signature,
            stale timestamp (>5 min), or oversized body. No body detail.

  /users:
    post:
      tags:
        - Users
      summary: Create a new user
      description: Creates a new user account. Requires admin role.
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '200':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

    get:
      tags:
        - Users
      summary: List users
      description: |
        Returns a list of users.

        - Admins see all users
        - Non-admins see only themselves
      operationId: listUsers
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/{uid}:
    parameters:
      - $ref: '#/components/parameters/UserUID'

    get:
      tags:
        - Users
      summary: Get user by UID
      description: |
        Retrieves a specific user by their UID, with the groups they belong to.

        Visibility matches `GET /users`: admins and viewers may read any user,
        everyone else only themselves. Asking for another user's UID returns
        404, the same as an unknown UID — the endpoint never confirms that an
        account exists.
      operationId: getUser
      responses:
        '200':
          description: User details, with the groups the user belongs to
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/User'
                  - type: object
                    properties:
                      user_groups:
                        type: array
                        items:
                          $ref: '#/components/schemas/UserGroup'
                    required:
                      - user_groups
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Users
      summary: Update user
      description: |
        Updates a user account.

        - Non-admins can only update their own password
        - Non-admins cannot change roles
        - API keys cannot change passwords (requires Basic Auth)
        - The admin role cannot be removed from the last remaining admin
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The update would remove the admin role from the last admin user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags:
        - Users
      summary: Delete user
      description: |
        Deletes a user account. Requires admin role.

        Note: Cannot delete your own user account, nor the last admin user.
      operationId: deleteUser
      responses:
        '200':
          description: User deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Deleting this user would leave the instance without any admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/{uid}/password:
    parameters:
      - $ref: '#/components/parameters/UserUID'

    put:
      tags:
        - Users
      summary: Change password (authenticated)
      description: |
        Changes a user's password. Requires re-authentication via username/password in the request body.

        **Important**: This endpoint does NOT use Bearer token authentication.
        Users must provide their username and current password for re-authentication.

        - Users can only change their own password
        - Admin users can change any user's password (with their own admin credentials)
        - Subject to rate limiting (same as login)
      operationId: changePassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Weak password
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum: [weak_password]
                  message:
                    type: string
                required:
                  - error
                  - message
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Cannot change another user's password (non-admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/{uid}/reset-password:
    parameters:
      - $ref: '#/components/parameters/UserUID'

    post:
      tags:
        - Users
      summary: Reset user password (admin only)
      description: |
        Allows administrators to reset any user's password without knowing the current password.

        **Important**: This endpoint requires web session authentication (Bearer token from login).
        API keys cannot use this endpoint.

        The user's `password_change_required` flag is cleared after the reset.
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Invalid request or weak password
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - type: object
                    properties:
                      error:
                        type: string
                        enum: [weak_password]
                      message:
                        type: string
                    required:
                      - error
                      - message
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not authorized (non-admin or API key authentication)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
