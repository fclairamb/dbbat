    # Grant schemas
    GrantControl:
      type: string
      enum:
        - read_only
        - block_copy
        - block_ddl
      description: |
        Control types that can be applied to a grant:
        - `read_only`: Enables PostgreSQL session read-only mode and blocks write queries
        - `block_copy`: Blocks all COPY commands (both TO and FROM)
        - `block_ddl`: Blocks DDL statements (CREATE, ALTER, DROP, TRUNCATE)

    GrantRequest:
      type: object
      description: |
        A user-initiated request for a grant of a particular shape on a
        particular database. Lifecycle: pending → approved/denied/cancelled.
        On approval the system creates a real AccessGrant (referenced via
        resulting_grant_id).
      properties:
        uid:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        grant_definition_id:
          type: string
          format: uuid
          description: |
            The exact definition *version* the request was filed against. An
            edit to that definition archives this row and inserts a successor,
            so this uid may name a version no listing returns anymore — read
            `definition` instead of resolving it.
        definition:
          allOf:
            - $ref: '#/components/schemas/GrantDefinition'
          description: |
            The **live** version of that definition's lineage, embedded on
            every read. Live rather than pinned because approving the request
            materializes today's policy, so today's version is the one to show
            (name, auto_approve, controls). A grant is the opposite case: it
            embeds the exact version it was issued from.
        database_id:
          type: string
          format: uuid
        justification:
          type: string
          maxLength: 1000
        status:
          type: string
          enum: [pending, approved, denied, cancelled, expired]
        requested_at:
          type: string
          format: date-time
        decided_at:
          type: string
          format: date-time
          nullable: true
        decided_by:
          type: string
          format: uuid
          nullable: true
        decision_reason:
          type: string
          nullable: true
        resulting_grant_id:
          type: string
          format: uuid
          nullable: true
      required:
        - uid
        - user_id
        - grant_definition_id
        - database_id
        - status
        - requested_at

    CreateGrantRequestPayload:
      type: object
      properties:
        grant_definition_id:
          type: string
          description: |
            Either the definition's uid or its slug. A syntactically
            UUID-shaped value is looked up as a uid only — slugs can never
            be UUID-shaped, so there is no fallback to attempt.
        database_id:
          type: string
          format: uuid
        justification:
          type: string
          maxLength: 1000
      required:
        - grant_definition_id
        - database_id

    GrantDefinition:
      type: object
      description: |
        The *shape* of a grant, and the single source of truth for what an
        access grant may do. Every grant is an instance of one — whether it
        came from a user's grant request or from an admin assigning it
        directly (`POST /grants`). Nothing creates a grant without one.

        Definitions are **immutably versioned**: a `PATCH` archives the current
        row and inserts a successor sharing its `lineage_uid`, and grants keep
        pointing at the exact row they were issued from. Editing a definition
        therefore never changes access that is already live; it changes what
        gets issued from then on.

        Two lifecycle states are deliberately distinct:

        - **archived** (`archived_at` set): superseded by a later edit. Still
          authorises the grants pinned to it — it was replaced, not withdrawn.
          Never appears in listings; still readable by uid.
        - **deactivated** (`is_active: false`): explicitly withdrawn, across
          every version of the lineage. Fails closed at authentication time:
          grants issued from any of its versions stop authorising new
          connections.
      properties:
        uid:
          type: string
          format: uuid
        lineage_uid:
          type: string
          format: uuid
          readOnly: true
          description: |
            Stable across every version of this definition (the first
            version's own uid). Deactivation, reactivation and deletion act on
            a lineage rather than a single version.
        archived_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: |
            When a later edit superseded this version. `null` means this is the
            live version — exactly one per lineage, enforced by a partial
            unique index on the slug.
        active_grant_count:
          type: integer
          format: int64
          readOnly: true
          description: |
            How many grants across this definition's lineage are currently
            authorising access. Populated on listings so the UI can tell an
            operator what deactivating it would cut off before they confirm.
        name:
          type: string
          maxLength: 64
        slug:
          type: string
          maxLength: 64
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: |
            Stable, human-typeable, machine-friendly identifier — what a CLI
            invocation, an agent prompt, a scripted REST call, or a runbook
            references instead of copying a uid out of the UI. Mandatory and
            unique; the server never generates one (the web UI derives it
            from the name until the operator edits it manually). Accepted
            anywhere a definition uid is accepted: `GET/PATCH/DELETE
            /grant-definitions/{uid}` and `grant_definition_id` on
            `POST /grant-requests` and `POST /grants`.

            Unique among **live** versions only: archived versions keep the
            slug they were created with, and resolving a slug always returns
            the live version. Address a specific historical version by uid.

            Must not be a UUID (in either the canonical hyphenated form or
            the bare 32-hex-digit form — both parse as one) — that would
            defeat the point of a human-typeable handle and make it
            ambiguous with the uid-based lookup on the endpoints above.
        description:
          type: string
        duration_seconds:
          type: integer
          format: int64
          minimum: 1
          description: How long the resulting grant remains valid after approval.
        controls:
          type: array
          items:
            $ref: '#/components/schemas/GrantControl'
        max_query_counts:
          type: integer
          format: int64
          nullable: true
        max_bytes_transferred:
          type: integer
          format: int64
          nullable: true
        priority:
          type: integer
          format: int32
          minimum: -32768
          maximum: 32767
          nullable: true
          description: |
            Selection priority stamped verbatim on every grant materialized
            from this definition. `null` — the normal case — means the grant
            gets the tier its controls earn (see `AccessGrant.priority`).
        auto_approve:
          type: boolean
          default: false
          description: |
            When true, grant requests against this definition skip the pending/admin-approval
            step and are approved (and the grant materialized) instantly at request time.
        user_group_uids:
          type: array
          items:
            type: string
            format: uuid
          description: |
            Restricts this definition to members of these user groups. An empty
            array means every user, which is how every pre-scoping definition
            keeps behaving. A dangling uid (deleted group) matches nobody, so
            the definition fails closed.
        server_group_uids:
          type: array
          items:
            type: string
            format: uuid
          description: |
            Restricts this definition to the databases currently belonging to
            these server groups. An empty array means every database.

            Membership is resolved **live**: adding a server to a scoped group
            makes the definition requestable against it immediately, with no
            edit and therefore no new version. A dangling uid (deleted group)
            matches no database, so the definition fails closed.

            Replaces the removed per-database `database_uids`; existing scopes
            were mirrored into auto-created server groups by migration
            20260809010000.
        scoped_database_uids:
          type: array
          items:
            type: string
            format: uuid
          nullable: true
          readOnly: true
          description: |
            `server_group_uids` resolved to the concrete databases currently
            in scope, so a non-admin requester can narrow their database
            picker without needing the admin-only `GET /server-groups`
            (membership there is access-relevant, so that gate stays). Only
            `GET /grant-definitions` and `GET /grant-definitions/{uid}`
            populate this; it leaks no group name or membership shape beyond
            "these databases are in scope," which a requester could already
            discover by trying. It is a convenience only — never the
            control: the server still enforces scope on
            `POST /grant-requests` regardless of what a client sends or
            ignores here.

            `null` (or the key omitted) means `server_group_uids` is empty:
            every database is in scope. A present array — which may be
            `[]` — means `server_group_uids` is non-empty and this is the
            resolved union of every scoped group's current members; `[]`
            means the definition is scoped but currently covers zero
            databases (e.g. every referenced group is empty). Do not treat
            a missing key the same as `[]`: one is "everything", the other
            is "nothing".
        approval_patterns:
          type: array
          items:
            type: string
          description: |
            RE2 patterns that suspend a matching statement mid-flight until an
            admin or an approver-group member approves it. An empty array means
            no approval gating. Validated (compiled) at save time, so a bad
            pattern is a 400 rather than a runtime surprise on the proxy hot
            path. Read from here by every grant issued from this definition —
            grants do not copy them.
        sample_queries:
          type: array
          items:
            type: string
          description: |
            Representative SQL statements saved alongside `approval_patterns`
            as a test bench for pattern authoring — test fixtures, not
            first-class matchers; the RE2 patterns above remain what the
            proxy actually evaluates. Because this is just another column on
            the definition row, it versions for free with every edit like
            `approval_patterns` does. Use
            `POST /grant-definitions/validate-patterns` to preview
            match/no-match against these before saving; a sample that
            doesn't match does not block the save.
        approver_user_group_uids:
          type: array
          items:
            type: string
            format: uuid
          description: |
            Groups whose members may resolve approval holds on grants built
            from this definition, *in addition to* admins. An empty array means
            admins only. Self-approval is always rejected.
        is_active:
          type: boolean
          readOnly: true
          description: |
            `false` once an operator has deactivated the definition. This is a
            withdrawal, not an archival: it applies to every version of the
            lineage and makes grants issued from it stop authorising new
            connections (fail closed). The rows themselves stay, since
            historical grants and grant requests still reference them.
        created_by:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - uid
        - name
        - slug
        - duration_seconds
        - controls
        - user_group_uids
        - server_group_uids
        - is_active
        - created_by
        - created_at

    CreateGrantDefinitionRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 64
        slug:
          type: string
          maxLength: 64
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: |
            Mandatory. Lowercase alphanumeric segments separated by single
            hyphens (e.g. `read-only-1h`). Never auto-generated by the
            server — the web UI derives it from the name until the operator
            edits it manually, but CLI/agent/scripted callers must supply
            one explicitly. Must be unique among live definitions; archived
            versions keep their slug and never conflict.

            Must not be a UUID (canonical hyphenated or bare 32-hex-digit
            form) — rejected with 400 even though both forms are shaped like
            valid slugs, since a UUID slug would defeat the point and be
            ambiguous with uid-based lookups.
        description:
          type: string
        duration_seconds:
          type: integer
          format: int64
          minimum: 1
        controls:
          type: array
          items:
            $ref: '#/components/schemas/GrantControl'
          default: []
        max_query_counts:
          type: integer
          format: int64
          nullable: true
        max_bytes_transferred:
          type: integer
          format: int64
          nullable: true
        priority:
          type: integer
          format: int32
          minimum: -32768
          maximum: 32767
          nullable: true
          description: |
            Optional selection priority for grants materialized from this
            definition. Omit (or send `null`) to let each grant take the tier
            its controls earn — see `AccessGrant.priority`.
        auto_approve:
          type: boolean
          default: false
          description: |
            When true, grant requests against this definition skip the pending/admin-approval
            step and are approved (and the grant materialized) instantly at request time.
        user_group_uids:
          type: array
          items:
            type: string
            format: uuid
          description: |
            Restricts this definition to members of these user groups. An empty
            array means every user, which is how every pre-scoping definition
            keeps behaving. A dangling uid (deleted group) matches nobody, so
            the definition fails closed.
        server_group_uids:
          type: array
          items:
            type: string
            format: uuid
          description: |
            Restricts this definition to the databases currently belonging to
            these server groups. An empty array means every database.
        approval_patterns:
          type: array
          items:
            type: string
          description: |
            RE2 patterns that suspend a matching statement mid-flight until an
            admin or an approver-group member approves it. An empty array means
            no approval gating. Validated (compiled) at save time, so a bad
            pattern is a 400 rather than a runtime surprise on the proxy hot
            path. Mirrored onto every grant materialized from this definition.
        sample_queries:
          type: array
          items:
            type: string
          description: |
            Representative SQL statements saved alongside `approval_patterns`
            to validate them against — see
            `GrantDefinition.sample_queries`.
        approver_user_group_uids:
          type: array
          items:
            type: string
            format: uuid
          description: |
            User groups whose members may resolve approval holds on grants
            built from this definition, *in addition to* admins. An empty
            array means admins only. Self-approval is always rejected.
        group_uids:
          type: array
          deprecated: true
          items:
            type: string
            format: uuid
          description: |
            **Deprecated** pre-rename spelling of `user_group_uids`, accepted
            on input for one release. `user_group_uids` wins when both are
            present; responses never emit this name.
        approver_group_uids:
          type: array
          deprecated: true
          items:
            type: string
            format: uuid
          description: |
            **Deprecated** pre-rename spelling of `approver_user_group_uids`,
            accepted on input for one release. The new name wins when both are
            present; responses never emit this name.
        database_uids:
          type: array
          deprecated: true
          items:
            type: string
            format: uuid
          description: |
            **Removed.** Per-database scoping was replaced by
            `server_group_uids`. Sending this field is a `400`, not a no-op:
            silently ignoring a scope restriction would fail *open*.
      required:
        - name
        - slug
        - duration_seconds

    UpdateGrantDefinitionRequest:
      type: object
      description: |
        PATCH body for `/grant-definitions/{uid}`. Every field is optional —
        a field omitted from the body is left untouched on the existing
        definition rather than reset. An explicit empty array (`[]`) still
        clears a list field; only a missing key (or explicit `null`) leaves
        it alone.

        `max_query_counts`, `max_bytes_transferred` and `priority` are
        themselves nullable in the domain (null = "no limit" / "auto"), so a
        bare `null` can't be told apart from an omitted key. Use the
        matching `clear_*` flag to explicitly reset one of them.
      properties:
        name:
          type: string
          maxLength: 64
        slug:
          type: string
          maxLength: 64
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: Same rules as `CreateGrantDefinitionRequest.slug`.
        description:
          type: string
        duration_seconds:
          type: integer
          format: int64
          minimum: 1
        controls:
          type: array
          items:
            $ref: '#/components/schemas/GrantControl'
        max_query_counts:
          type: integer
          format: int64
          nullable: true
        clear_max_query_counts:
          type: boolean
          description: When true, resets max_query_counts to unlimited.
        max_bytes_transferred:
          type: integer
          format: int64
          nullable: true
        clear_max_bytes_transferred:
          type: boolean
          description: When true, resets max_bytes_transferred to unlimited.
        priority:
          type: integer
          format: int32
          minimum: -32768
          maximum: 32767
          nullable: true
        clear_priority:
          type: boolean
          description: When true, resets priority to auto (tier derived from controls).
        auto_approve:
          type: boolean
          description: |
            When true, grant requests against this definition skip the pending/admin-approval
            step and are approved (and the grant materialized) instantly at request time.
        user_group_uids:
          type: array
          items:
            type: string
            format: uuid
          description: Same semantics as `CreateGrantDefinitionRequest.user_group_uids`.
        server_group_uids:
          type: array
          items:
            type: string
            format: uuid
          description: Same semantics as `CreateGrantDefinitionRequest.server_group_uids`.
        approval_patterns:
          type: array
          items:
            type: string
          description: Same semantics as `CreateGrantDefinitionRequest.approval_patterns`.
        sample_queries:
          type: array
          items:
            type: string
          description: Same semantics as `CreateGrantDefinitionRequest.sample_queries`.
        approver_user_group_uids:
          type: array
          items:
            type: string
            format: uuid
          description: Same semantics as `CreateGrantDefinitionRequest.approver_user_group_uids`.
        group_uids:
          type: array
          deprecated: true
          items:
            type: string
            format: uuid
          description: |
            **Deprecated** pre-rename spelling of `user_group_uids`, accepted
            on input for one release. `user_group_uids` wins when both are
            present; responses never emit this name.
        approver_group_uids:
          type: array
          deprecated: true
          items:
            type: string
            format: uuid
          description: |
            **Deprecated** pre-rename spelling of `approver_user_group_uids`,
            accepted on input for one release. The new name wins when both are
            present; responses never emit this name.
        database_uids:
          type: array
          deprecated: true
          items:
            type: string
            format: uuid
          description: |
            **Removed.** Per-database scoping was replaced by
            `server_group_uids`. Sending this field is a `400`, not a no-op:
            silently ignoring a scope restriction would fail *open*.

    AccessGrant:
      type: object
      properties:
        uid:
          type: string
          format: uuid
          description: Unique identifier
        user_id:
          type: string
          format: uuid
          description: User UID
        database_id:
          type: string
          format: uuid
          description: |
            The grant's anchor database — the one it was issued for. It is what
            an unbound grant covers, and what a group-bound one falls back to
            if its group is deleted outright.
        server_group_uid:
          type: string
          format: uuid
          nullable: true
          description: |
            The server group this grant is bound to. A bound grant covers every
            server the group contains **right now**, and only those: the
            binding replaces the single-database scope rather than adding to
            it, so a server removed from the group stops being covered even
            when it is the anchor.

            Membership is live and never snapshotted, so adding a server to the
            group widens this grant the instant it is saved.

            `null` — the default, and the state of every grant issued from a
            definition with no server-group scope — means "anchor database
            only".

            Quotas and `priority` follow the grant, not the database: one
            `max_query_counts` and one `max_bytes_transferred` budget are
            consumed across the whole group.
        grant_definition_id:
          type: string
          format: uuid
          description: |
            The exact grant definition *version* this grant was issued from.
            Definitions are immutably versioned — an edit archives the current
            row and inserts a successor — so this pins the behavior the grant
            was issued with and no later edit can change it.
        definition:
          allOf:
            - $ref: '#/components/schemas/GrantDefinition'
          description: |
            The pinned definition, embedded on every grant read. This is where
            the grant's controls, quotas, approval patterns and approver groups
            live; the grant row itself has none of them.
        granted_by:
          type: string
          format: uuid
          description: Admin who granted access
        starts_at:
          type: string
          format: date-time
          description: When access starts
        expires_at:
          type: string
          format: date-time
          description: When access expires
        revoked_at:
          type: string
          format: date-time
          nullable: true
          description: When access was revoked (null if active)
        revoked_by:
          type: string
          format: uuid
          nullable: true
          description: Admin who revoked access
        priority:
          type: integer
          format: int32
          minimum: -32768
          maximum: 32767
          description: |
            Ranks this grant against the other active grants the same user
            holds on the same database. A new session is admitted under the
            highest-priority active grant; ties break on the latest
            `expires_at`, then the newest `created_at`.

            Auto-calculated from the definition's `controls` unless the
            definition pins a `priority` of its own:

            | grant shape | priority |
            |---|---|
            | writable, no controls | 100 |
            | writable with `block_copy` / `block_ddl` | 50 |
            | `read_only` (whatever else it carries) | 10 |

            The gaps let an override slot between tiers. Selection happens
            once, at authentication: the session stays pinned to the grant it
            was admitted under and is terminated when that grant expires or is
            revoked, even if a lower-priority grant would still allow access —
            the client reconnects and selection runs afresh.
        query_count:
          type: integer
          format: int64
          description: Current query count
        bytes_transferred:
          type: integer
          format: int64
          description: Current bytes transferred
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
      required:
        - uid
        - user_id
        - database_id
        - grant_definition_id
        - granted_by
        - starts_at
        - expires_at
        - priority
        - created_at

    AssignGrantRequest:
      type: object
      description: |
        Body for `POST /grants`. A grant is an instance of a grant definition
        and nothing else — there is deliberately no way to describe controls,
        quotas or approval gating here. Those live on the definition, which is
        what makes definitions trustworthy as the policy source of truth.
      properties:
        grant_definition_id:
          type: string
          description: |
            The definition to instantiate — its uid or its slug. A slug always
            resolves to the live version; naming an archived version by uid
            still issues the live one, since an edit exists precisely to change
            what gets issued from then on.
        user_id:
          type: string
          format: uuid
          description: User UID
        database_id:
          type: string
          format: uuid
          description: Database UID
        starts_at:
          type: string
          format: date-time
          description: |
            When access starts. Defaults to now. The window's *length* is the
            definition's `duration_seconds` and cannot be overridden here.
      required:
        - grant_definition_id
        - user_id
        - database_id

    DeactivateGrantDefinitionResponse:
      type: object
      properties:
        message:
          type: string
        affected_grants:
          type: integer
          format: int64
          description: |
            How many currently-active grants the deactivation failed closed.
            Absent on a hard delete, which by definition affected none.
      required:
        - message

    ValidatePatternsRequest:
      type: object
      description: Body for `POST /grant-definitions/validate-patterns`.
      properties:
        patterns:
          type: array
          items:
            type: string
          description: RE2 approval-pattern sources to test.
        queries:
          type: array
          items:
            type: string
          description: Sample SQL statements to test the patterns against.

    ValidatePatternsResponse:
      type: object
      properties:
        patterns:
          type: array
          description: |
            One entry per pattern in the request, same order, reporting
            whether it compiled.
          items:
            $ref: '#/components/schemas/PatternValidationResult'
        queries:
          type: array
          description: |
            One entry per query in the request, same order, reporting its
            normalized form and first match.
          items:
            $ref: '#/components/schemas/QueryValidationResult'
      required:
        - patterns
        - queries

    PatternValidationResult:
      type: object
      properties:
        pattern:
          type: string
        error:
          type: string
          description: |
            The compile error message. Present only when the pattern failed
            to compile — this is the error `NewApprovalGate` otherwise
            swallows with only a warning log.
      required:
        - pattern

    QueryValidationResult:
      type: object
      properties:
        query:
          type: string
        normalized:
          type: string
          description: |
            The `NormalizeSQL` form of the query — what the approval patterns
            actually run against, not the raw text.
        matched:
          type: boolean
        matched_pattern:
          type: string
          description: |
            The source text of the first pattern that matched, in request
            order. Present only when `matched` is true.
      required:
        - query
        - normalized
        - matched

    # API Key schemas
    APIKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier
        user_id:
          type: string
          format: uuid
          description: User UID
        name:
          type: string
          description: Key name
        key_prefix:
          type: string
          description: Key prefix for identification
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: When the key expires
        last_used_at:
          type: string
          format: date-time
          nullable: true
          description: When the key was last used
        request_count:
          type: integer
          format: int64
          description: Total requests made with this key
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        revoked_at:
          type: string
          format: date-time
          nullable: true
          description: When the key was revoked
        revoked_by:
          type: string
          format: uuid
          nullable: true
          description: User who revoked the key
      required:
        - id
        - user_id
        - name
        - key_prefix
        - request_count
        - created_at

    CreateAPIKeyRequest:
      type: object
      properties:
        name:
          type: string
          description: Key name
        expires_at:
          type: string
          format: date-time
          description: Optional expiration time
      required:
        - name

    CreateAPIKeyResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier
        name:
          type: string
          description: Key name
        key:
          type: string
          description: Full API key (only shown once!)
        key_prefix:
          type: string
          description: Key prefix for identification
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: When the key expires
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        connections:
          type: array
          description: Connection URLs for databases the key's owner has active grants on
          items:
            $ref: '#/components/schemas/ConnectionInfo'
        connections_truncated:
          type: boolean
          description: True when there are more than 50 connections (list is truncated)
      required:
        - id
        - name
        - key
        - key_prefix
        - created_at
        - connections
        - connections_truncated

    # OAuth 2.0 Device Authorization Grant (RFC 8628) schemas
    DeviceAuthorizationRequest:
      type: object
      properties:
        client_name:
          type: string
          description: Human-readable label for the requesting app (e.g. "stn on host"), shown on the consent page. dbbat extension.
        client_id:
          type: string
          description: Accepted for OAuth compatibility but ignored.

    DeviceAuthorizationResponse:
      type: object
      properties:
        device_code:
          type: string
          description: Secret code the client polls the token endpoint with. Never display or log this value.
        user_code:
          type: string
          description: Short human-checkable code the user enters/verifies in the browser (e.g. "WDJP-4KXR")
        verification_uri:
          type: string
          description: Browser URL the user opens and enters the user_code at
        verification_uri_complete:
          type: string
          description: verification_uri with the user_code pre-filled — open this directly
        expires_in:
          type: integer
          description: Seconds until the request expires
        interval:
          type: integer
          description: Minimum seconds to wait between polls
      required:
        - device_code
        - user_code
        - verification_uri
        - verification_uri_complete
        - expires_in
        - interval

    DeviceTokenRequest:
      type: object
      properties:
        grant_type:
          type: string
          description: Must be "urn:ietf:params:oauth:grant-type:device_code"
          enum: ["urn:ietf:params:oauth:grant-type:device_code"]
        device_code:
          type: string
        client_id:
          type: string
          description: Accepted for OAuth compatibility but ignored.
      required:
        - grant_type
        - device_code

    DeviceTokenResponse:
      type: object
      properties:
        access_token:
          type: string
          description: The minted API key (dbb_...), delivered exactly once
        token_type:
          type: string
          enum: [Bearer]
      required:
        - access_token
        - token_type

    LoginExchangeRequest:
      type: object
      properties:
        code:
          type: string
          description: The one-time code handed to the browser by the OAuth callback
      required:
        - code

    LoginExchangeResponse:
      type: object
      properties:
        access_token:
          type: string
          description: The web session token (web_...), delivered exactly once
        token_type:
          type: string
          enum: [Bearer]
      required:
        - access_token
        - token_type

    OAuthError:
      type: object
      properties:
        error:
          type: string
          description: OAuth error code
        error_description:
          type: string
      required:
        - error

    DeviceConsentInfo:
      type: object
      properties:
        client_name:
          type: string
        user_code:
          type: string
        status:
          type: string
          enum: [pending, approved, denied]
        expires_at:
          type: string
          format: date-time
      required:
        - client_name
        - user_code
        - status
        - expires_at

    DeviceConsentRequest:
      type: object
      properties:
        user_code:
          type: string
        approve:
          type: boolean
      required:
        - user_code
        - approve

    # Connection schemas
    Connection:
      type: object
      properties:
        uid:
          type: string
          format: uuid
          description: Unique identifier
        user_id:
          type: string
          format: uuid
          description: User UID
        database_id:
          type: string
          format: uuid
          description: Database UID
        source_ip:
          type: string
          description: Client IP address
        connected_at:
          type: string
          format: date-time
          description: Connection start time
        last_activity_at:
          type: string
          format: date-time
          description: Last activity timestamp
        disconnected_at:
          type: string
          format: date-time
          nullable: true
          description: Connection end time (null if still connected)
        queries:
          type: integer
          format: int64
          description: Number of queries executed
        bytes_transferred:
          type: integer
          format: int64
          description: Total bytes transferred
        upstream_tls:
          type: boolean
          description: >-
            Whether the proxy→upstream leg of this session was actually
            encrypted. The server's ssl_mode states a policy, not an outcome:
            the opportunistic modes (`prefer`, and the empty default) offer TLS
            and fall back to plaintext when the target refuses, so only the
            session knows which way it went. Always false for Oracle, whose
            proxy relays the client's own TNS Connect descriptor over a plain
            socket.
        grant_uid:
          type: string
          format: uuid
          nullable: true
          description: >-
            The access grant this session authenticated under — the auth-time
            selection, pinned for the life of the connection and never
            updated afterwards. Null on connections that predate this column,
            or whose grant has since been deleted (revocation does not clear
            it — only deletion, which does not otherwise happen, does).
      required:
        - uid
        - user_id
        - database_id
        - source_ip
        - connected_at
        - last_activity_at
        - queries
        - bytes_transferred

    # ConnectionDetail is what GET /connections/{uid} returns: a Connection
    # plus capture metadata and a grant summary. The list endpoint
    # (GET /connections) returns plain Connection objects — computing dump
    # availability (an os.Stat, or a blob HEAD for a remotely-stored capture)
    # or resolving the linked grant for every row of a paginated list would be
    # a needless fan-out that a single detail fetch doesn't pay.
    ConnectionDetail:
      allOf:
        - $ref: '#/components/schemas/Connection'
        - type: object
          properties:
            dump:
              $ref: '#/components/schemas/DumpMetadata'
            grant:
              allOf:
                - $ref: '#/components/schemas/GrantSummary'
              nullable: true
              description: >-
                The grant named by `grant_uid`, or null when `grant_uid` is
                null or the grant it names could not be resolved.
          required:
            - dump
            - grant

    # GrantSummary is the small slice of AccessGrant the UI needs to show
    # "under which grant did this session run?" on a connection detail page
    # without a second round trip. Deliberately not the full AccessGrant:
    # usage counters and approval configuration belong to the grants page, not
    # here.
    GrantSummary:
      type: object
      properties:
        uid:
          type: string
          format: uuid
          description: Grant identifier — links to the Grants page.
        controls:
          type: array
          items:
            $ref: '#/components/schemas/GrantControl'
          description: >-
            The controls this session ran under, read from the grant's pinned
            definition. Empty array means full write access.
        starts_at:
          type: string
          format: date-time
          description: When access starts
        expires_at:
          type: string
          format: date-time
          description: When access expires
        revoked:
          type: boolean
          description: Whether the grant has been revoked.
        priority:
          type: integer
          format: int32
          minimum: -32768
          maximum: 32767
          description: >-
            This grant's selection rank — see AccessGrant.priority for the
            full explanation.
        grant_definition_id:
          type: string
          format: uuid
          description: The definition version the grant was issued from — links to the policy.
        grant_definition_name:
          type: string
        grant_definition_slug:
          type: string
        grant_definition_is_active:
          type: boolean
          description: >-
            False once the definition was deactivated, which is why a grant
            that still looks in-window may no longer authorise a connection.
      required:
        - uid
        - controls
        - starts_at
        - expires_at
        - revoked
        - priority
        - grant_definition_id

    DumpMetadata:
      type: object
      description: >-
        Whether a raw pcapng session capture is available for download via
        `GET /connections/{uid}/dump`, and its size. `available: false`
        covers both "captures are disabled server-wide" (no `DBB_DUMP_DIR`)
        and "no capture exists — or no longer exists — for this connection".
      properties:
        available:
          type: boolean
          description: Whether the capture can currently be downloaded.
        size_bytes:
          type: integer
          format: int64
          description: >-
            Capture size in bytes. 0 when `available` is false.
      required:
        - available
        - size_bytes

    # Query schemas
    Query:
      type: object
      properties:
        uid:
          type: string
          format: uuid
          description: Unique identifier
        connection_id:
          type: string
          format: uuid
          description: Connection UID
        user_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            UID of the user who ran the query, resolved from the connection.
            Only populated when listing queries.
        database_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            UID of the target database, resolved from the connection.
            Only populated when listing queries.
        sql_text:
          type: string
          description: SQL query text
        parameters:
          $ref: '#/components/schemas/QueryParameters'
        executed_at:
          type: string
          format: date-time
          description: Execution timestamp
        duration_ms:
          type: number
          format: double
          nullable: true
          description: Execution duration in milliseconds
        rows_affected:
          type: integer
          format: int64
          nullable: true
          description: Number of rows affected
        error:
          type: string
          nullable: true
          description: Error message if query failed
        results_truncated:
          type: boolean
          description: >-
            True when result capture stopped on a storage limit
            (`max_result_rows` / `max_result_bytes`). The rows captured before
            the limit are still stored, so this is what distinguishes a
            prefix — or an empty capture — from a query that genuinely
            returned that many rows.
        results_dropped:
          type: boolean
          description: >-
            True when dbbat lost result rows it meant to keep: the batched row
            writer's queue was full (storage fell behind the proxy) or a batch
            insert failed. Deliberately distinct from `results_truncated` —
            truncation is an expected, configured prefix, a drop is dbbat
            failing to keep up — and the two are never conflated. Rows are
            never held back from the client to keep the capture complete.
        approval_status:
          type: string
          nullable: true
          enum: [pending, approved, denied, abandoned]
          description: >-
            Approval-hold state. Absent for the overwhelming majority of
            queries (no approval pattern matched). `pending` means the
            statement is parked mid-flight waiting for a human and has NOT run.
            `abandoned` means the client gave up (disconnect, cancel, grant
            expiry, shutdown) before anyone decided — nothing ran, and it is
            deliberately distinct from `denied`. There is no `timeout` value:
            a hold has no clock of its own.
        approval_pattern:
          type: string
          nullable: true
          description: The grant's approval pattern that matched this statement
        resolved_by:
          type: string
          format: uuid
          nullable: true
          description: UID of the user who approved or denied the hold
        resolved_at:
          type: string
          format: date-time
          nullable: true
          description: When the hold was resolved
        resolution_reason:
          type: string
          nullable: true
          description: Reason supplied by the approver (or the system, on abandon)
        copy_direction:
          type: string
          nullable: true
          enum: [in, out]
          description: >-
            Direction of a bulk transfer: `out` for `COPY … TO` (data leaving
            the database), `in` for `COPY … FROM`. Absent for every statement
            that is not a COPY.
        copy_format:
          type: string
          nullable: true
          enum: [text, csv, binary, unknown]
          description: >-
            Wire format the COPY used. Absent for every statement that is not
            a COPY.
      required:
        - uid
        - connection_id
        - sql_text
        - executed_at

    ApprovalResolution:
      type: object
      description: The outcome of an approve/deny decision on a held query.
      properties:
        query_uid:
          type: string
          format: uuid
        approval_status:
          type: string
          enum: [approved, denied]
        resolution_reason:
          type: string
        resolved_by:
          type: object
          description: Who resolved the hold — broadcast on the stream too, so every watcher sees it.
          properties:
            uid:
              type: string
              format: uuid
            username:
              type: string
            display_name:
              type: string

    QueryParameters:
      type: object
      description: Query parameter values (for prepared statements)
      properties:
        values:
          type: array
          items:
            type: string
          description: Decoded string representations
        raw:
          type: array
          items:
            type: string
          description: Base64-encoded raw bytes
        format_codes:
          type: array
          items:
            type: integer
          description: Format codes (0=text, 1=binary)
        type_oids:
          type: array
          items:
            type: integer
          description: PostgreSQL type OIDs

    QueryWithRows:
      allOf:
        - $ref: '#/components/schemas/Query'
        - type: object
          properties:
            rows:
              type: array
              items:
                $ref: '#/components/schemas/QueryRow'
              description: Result rows (from SELECT or COPY operations)

    QueryRow:
      type: object
      properties:
        row_number:
          type: integer
          description: Row index
        row_data:
          type: object
          additionalProperties: true
          description: Row data as JSON object
        row_size_bytes:
          type: integer
          format: int64
          description: Row size in bytes
      required:
        - row_number
        - row_data
        - row_size_bytes

    QueryRowsResponse:
      type: object
      description: Paginated query rows response
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/QueryRow'
          description: Array of row objects
        next_cursor:
          type: string
          nullable: true
          description: Cursor for the next page (null if no more rows)
        has_more:
          type: boolean
          description: Whether more rows are available
        total_rows:
          type: integer
          format: int64
          description: Total number of rows for this query
      required:
        - rows
        - has_more
        - total_rows

    # Audit schemas
    AuditEvent:
      type: object
      properties:
        uid:
          type: string
          format: uuid
          description: Unique identifier
        event_type:
          type: string
          description: Event type (e.g., user.created, grant.revoked)
        user_id:
          type: string
          format: uuid
          nullable: true
          description: User being acted upon
        performed_by:
          type: string
          format: uuid
          nullable: true
          description: User performing the action
        details:
          type: object
          additionalProperties: true
          description: Event-specific details
        created_at:
          type: string
          format: date-time
          description: Event timestamp
      required:
        - uid
        - event_type
        - created_at

    ChainBreak:
      type: object
      description: |
        The first record that failed to verify. It identifies the record and
        says what did not add up; it never echoes the record's content.
      properties:
        uid:
          type: string
          format: uuid
          description: |
            UID of the offending row, or of the connection when the break is a
            stamped-head mismatch
        chain_seq:
          type: integer
          format: int64
          description: Position in the chain, or 0 when the break is about the chain as a whole
        connection_uid:
          type: string
          format: uuid
          description: Set for query-chain breaks
        reason:
          type: string
          description: Human-readable description of what did not add up
      required:
        - uid
        - chain_seq
        - reason

    AuditChainVerification:
      type: object
      description: |
        Outcome of walking the store-wide audit chain. Carries counts,
        positions and the chain head — never the chain key, never the content
        of an audited record.
      properties:
        chain:
          type: string
          enum: [audit]
          description: Which chain was walked
        verified:
          type: boolean
          description: True when the chain is intact
        entries:
          type: integer
          format: int64
          description: |
            How many chained rows were walked. When there is a break, this is
            how many verified before it: nothing after a break means anything.
        head_seq:
          type: integer
          format: int64
          description: Chain position the walk ended on
        head_mac:
          type: string
          description: |
            The chain head, hex-encoded. Record it outside the database — it is
            what detects a chain truncated and re-sealed by someone who had the
            key. Publishing a MAC is safe; the key that produced it never
            leaves the process.
        unverifiable_pre_anchor_entries:
          type: integer
          format: int64
          description: |
            Rows written before chaining was introduced. No MAC exists for them
            and none can be created after the fact, so they are reported rather
            than folded into the verified count.
        break:
          $ref: '#/components/schemas/ChainBreak'
        checked_at:
          type: string
          format: date-time
          description: When this walk ran
        cached:
          type: boolean
          description: |
            True when this answer is a remembered walk rather than one run for
            this request. A chain walk is O(rows), so its outcome is cached for
            a minute.
      required:
        - chain
        - verified
        - entries
        - head_seq
        - head_mac
        - unverifiable_pre_anchor_entries
        - checked_at
        - cached

    QueryChainVerification:
      type: object
      description: |
        Outcome of walking the per-connection query chains. Carries counts,
        positions and — for a single-connection walk — that chain's head. Never
        the chain key, never SQL text, parameters or any other statement
        content.
      properties:
        chain:
          type: string
          enum: [queries]
          description: Which chain was walked
        verified:
          type: boolean
          description: True when every chain walked is intact
        connection_uid:
          type: string
          format: uuid
          description: Set only when the walk was scoped to one session
        connections:
          type: integer
          format: int64
          description: How many sessions were walked
        statements:
          type: integer
          format: int64
          description: How many chained statements were checked across them
        chains_with_truncated_prefix:
          type: integer
          format: int64
          description: |
            Chains missing their oldest statements — what
            DBB_QUERY_STORAGE_RETENTION leaves behind on a long-lived session.
            Expected housekeeping, not tampering; everything after the
            truncation is still verified.
        legacy_stamps:
          type: integer
          format: int64
          description: |
            Sessions whose head stamp predates 0.24 and is a verbatim copy of
            the last statement's MAC rather than a keyed seal. Anyone who can
            write to the store can write that value, so those chains verified
            but nothing keyed vouches for their *tail*. Not a failure: the
            number drains as pre-upgrade sessions age out of retention, and
            every session closed since is sealed. A number that stops falling
            — or rises — is worth investigating.
        head_seq:
          type: integer
          format: int64
          description: |
            Chain position the walk ended on. Reported only for a
            single-connection walk: an aggregate head over many independent
            chains would not mean anything.
        head_mac:
          type: string
          description: That chain's head, hex-encoded. Single-connection walks only.
        break:
          $ref: '#/components/schemas/ChainBreak'
        checked_at:
          type: string
          format: date-time
          description: When this walk ran
        cached:
          type: boolean
          description: True when this answer is a remembered walk rather than one run for this request
      required:
        - chain
        - verified
        - connections
        - statements
        - chains_with_truncated_prefix
        - legacy_stamps
        - checked_at
        - cached

    # Connection URL schemas
    ConnectionInfo:
      type: object
      description: Ready-to-paste connection URL for a database
      properties:
        database_uid:
          type: string
          format: uuid
        database_name:
          type: string
        protocol:
          type: string
        format:
          type: string
          description: '"uri" or "ez-connect"'
          enum:
            - uri
            - ez-connect
        url:
          type: string
          description: Ready-to-paste connection URL
      required:
        - database_uid
        - database_name
        - protocol
        - format
        - url

    # Global parameters schemas
    GlobalParameter:
      type: object
      description: A runtime-editable key-value configuration entry
      properties:
        uid:
          type: string
          format: uuid
        group_key:
          type: string
        key:
          type: string
        value:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - uid
        - group_key
        - key
        - value
        - created_at
        - updated_at

    SetParameterRequest:
      type: object
      properties:
        value:
          type: string
      required:
        - value

    PublicEndpoints:
      type: object
      description: >-
        Public endpoint advertisement settings. Covers two independent
        network paths: the *connection* host (host/pg_host/ora_host/
        mysql_host/*_port — where SQL clients reach the PG/Oracle/MySQL
        proxies, via direct or TCP-load-balancer access) and the *Web UI*
        host (web_ui_url — where the browser and REST API are reached,
        behind an HTTP ingress / reverse proxy). These are typically two
        different DNS names on two different network paths.
      properties:
        host:
          type: string
          description: Default public hostname for all protocols (the connection host, e.g. db.company.com)
        pg_host:
          type: string
          description: PostgreSQL-specific host override (empty = use host)
        ora_host:
          type: string
          description: Oracle-specific host override (empty = use host)
        mysql_host:
          type: string
          description: MySQL-specific host override (empty = use host)
        mongo_host:
          type: string
          description: MongoDB-specific host override (empty = use host)
        pg_port:
          type: integer
          nullable: true
          description: PostgreSQL port override (null = use local listen port)
        ora_port:
          type: integer
          nullable: true
          description: Oracle port override (null = use local listen port)
        mysql_port:
          type: integer
          nullable: true
          description: MySQL port override (null = use local listen port)
        mongo_port:
          type: integer
          nullable: true
          description: MongoDB port override (null = use local listen port)
        web_ui_url:
          type: string
          description: >-
            Web UI / public base URL override (e.g. https://dbbat.company.com),
            reached through an HTTP ingress / reverse proxy. Empty = fall
            back to the DBB_PUBLIC_URL environment variable. Used for Slack
            deep-links and other absolute-URL generation. Independent of
            `host`, which advertises the connection host instead.

    ResolvedEndpoints:
      type: object
      description: Fully resolved connection advertisement values after fallback chains
      properties:
        pg_host:
          type: string
        pg_port:
          type: integer
          description: 0 = protocol disabled
        ora_host:
          type: string
        ora_port:
          type: integer
        mysql_host:
          type: string
        mysql_port:
          type: integer
        mongo_host:
          type: string
        mongo_port:
          type: integer
        web_ui_url:
          type: string
          description: Effective Web UI / public base URL (web_ui_url parameter, falling back to DBB_PUBLIC_URL)
      required:
        - pg_host
        - pg_port
        - ora_host
        - ora_port
        - mysql_host
        - mysql_port
        - mongo_host
        - mongo_port
        - web_ui_url

    InstanceInfo:
      type: object
      description: Instance information including listen addresses and public endpoint config
      properties:
        listen:
          type: object
          description: >-
            Live listen addresses this process is bound to, straight from
            config (DBB_LISTEN_*). `api` is the HTTP listener (REST API +
            Web UI, meant for an HTTP reverse proxy / ingress); `pg`, `ora`,
            and `mysql` are TCP listeners (SQL client proxies, meant for a
            TCP load balancer).
          properties:
            pg:
              type: string
              description: PostgreSQL proxy TCP listen address
            ora:
              type: string
              description: Oracle proxy TCP listen address
            mysql:
              type: string
              description: MySQL/MariaDB proxy TCP listen address
            mongo:
              type: string
              description: MongoDB proxy TCP listen address
            mssql:
              type: string
              description: SQL Server (TDS) proxy TCP listen address
            api:
              type: string
              description: REST API / Web UI HTTP listen address
          required:
            - pg
            - ora
            - mysql
            - api
        public:
          $ref: '#/components/schemas/PublicEndpoints'
          nullable: true
          description: Only present for admin callers
        resolved:
          $ref: '#/components/schemas/ResolvedEndpoints'
      required:
        - listen
        - resolved

    # Common schemas
    Error:
      type: object
      description: Standard error response
      properties:
        code:
          type: string
          description: Machine-readable error code
          enum:
            - INTERNAL_ERROR
            - VALIDATION_ERROR
            - NOT_FOUND
            - UNAUTHORIZED
            - FORBIDDEN
            - INVALID_CREDENTIALS
            - PASSWORD_CHANGE_REQUIRED
            - WEAK_PASSWORD
            - RATE_LIMITED
            - DUPLICATE_NAME
            - TARGET_MATCHES_SELF
            - GRANT_EXPIRED
            - QUOTA_EXCEEDED
        message:
          type: string
          description: Human-readable error message
        detail:
          type: string
          description: Additional context
        retry_after:
          type: integer
          description: Seconds until retry (rate-limited responses only)
      required:
        - code
        - message

    MessageResponse:
      type: object
      properties:
        message:
          type: string
          description: Success message
      required:
        - message

    MCPMessage:
      type: object
      description: |
        A JSON-RPC 2.0 message as defined by the Model Context Protocol. The
        body may also be a batch (an array of these). The shape is deliberately
        open: MCP owns this schema, and pinning it here would go stale against
        the protocol rather than validate anything useful.
      properties:
        jsonrpc:
          type: string
          enum:
            - '2.0'
        id:
          description: Request id; absent on notifications
          oneOf:
            - type: string
            - type: integer
        method:
          type: string
          description: 'MCP method, e.g. initialize, tools/list, tools/call'
        params:
          type: object
          additionalProperties: true
        result:
          type: object
          additionalProperties: true
        error:
          type: object
          additionalProperties: true
      required:
        - jsonrpc
      additionalProperties: true

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: Authentication required or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    AuthRateLimited:
      description: Too many failed authentication attempts
      headers:
        Retry-After:
          description: Seconds until retry is allowed
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Forbidden:
      description: Insufficient permissions or password change required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    PasswordChangeRequired:
      description: User must change their initial password before accessing the API
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Conflict:
      description: Conflict with the current state (e.g. a resource with that name already exists)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After:
          description: Seconds until retry is allowed
          schema:
            type: integer
        X-RateLimit-Limit:
          description: Maximum requests per minute
          schema:
            type: integer
        X-RateLimit-Remaining:
          description: Remaining requests in current window
          schema:
            type: integer
        X-RateLimit-Reset:
          description: Unix timestamp when limit resets
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
