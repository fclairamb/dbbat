name: Showcase media

# Two jobs, two very different purposes:
#
#   generate  — manual only (workflow_dispatch). Regenerates the website's
#               screenshots and the approval video. Deliberately NOT triggered
#               by a release or a push: the media is stamped with the version
#               it was captured from (website/static/img/showcase/manifest.json)
#               so staleness is visible instead of being papered over by an
#               automatic rebuild nobody reviewed.
#
#   rot-guard — runs the same suite on pull requests that touch front/, with
#               the output thrown away. It exists so a UI change that breaks a
#               capture scenario is caught when the UI changes, not months
#               later at release time. It is continue-on-error and is NOT a
#               required check: media capture is too timing-sensitive to gate
#               merges on.

on:
  workflow_dispatch:
    inputs:
      open_pr:
        description: "Open a pull request with the regenerated media"
        type: boolean
        default: false
      project:
        description: "Which showcase project to run"
        type: choice
        options: ["all", "screenshots", "poster", "video"]
        default: "all"
  pull_request:
    branches: [main]
    paths:
      - "front/**"
      - "scripts/showcase.sh"
      - ".github/workflows/showcase.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Generate — manual regeneration of the committed media
  # ===========================================================================
  generate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # the manifest records the commit it captured from

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.26.6"

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -hide_banner -encoders | grep -E 'libsvtav1|libx264' || true

      - name: Cache Playwright browsers
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('front/bun.lock') }}

      - name: Install frontend dependencies
        run: |
          bun install
          bunx playwright install --with-deps chromium
        working-directory: front

      - name: Generate showcase media
        run: make showcase
        env:
          # "all" is the choice-input stand-in for "no --project filter":
          # workflow_dispatch choices cannot be empty strings.
          SHOWCASE_PROJECT: ${{ inputs.project == 'all' && '' || inputs.project }}

      - name: Upload showcase media
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: showcase-media
          path: website/static/img/showcase/
          retention-days: 30

      - name: Upload runner logs
        uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: showcase-logs
          path: front/showcase/.artifacts/
          retention-days: 7

      - name: Open a pull request with the regenerated media
        if: inputs.open_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain website/static/img/showcase)" ]; then
            echo "No change to the showcase media — nothing to open."
            exit 0
          fi
          version=$(node -e 'process.stdout.write(require("./.release-please-manifest.json")["."])')
          branch="chore/showcase-media-${version}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${branch}"
          git add website/static/img/showcase
          git commit -m "docs(website): regenerate showcase media for v${version}"
          git push origin "${branch}"
          gh pr create \
            --title "docs(website): regenerate showcase media for v${version}" \
            --body "Regenerated by the \`Showcase media\` workflow (run ${GITHUB_RUN_ID}) from a live demo-mode instance. See \`website/static/img/showcase/manifest.json\` for the exact version and commit captured." \
            --base main \
            --head "${branch}"

  # ===========================================================================
  # Rot guard — same suite, output discarded, never blocking
  # ===========================================================================
  rot-guard:
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-please-')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true # informational only — must never block a merge
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.26.6"

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Cache Playwright browsers
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('front/bun.lock') }}

      - name: Install frontend dependencies
        run: |
          bun install
          bunx playwright install --with-deps chromium
        working-directory: front

      # Cheap and deterministic, so it runs first — a type error in the runner
      # should not cost a full stack bring-up to discover. It lives here rather
      # than in ci.yml's frontend job on purpose: the showcase must not gate a
      # merge.
      - name: Type-check the showcase runner
        run: bun run typecheck:showcase
        working-directory: front

      # Output goes to a scratch directory and is never uploaded or committed:
      # this job proves the scenarios still work, it does not produce media.
      # Transcoding is skipped too — ffmpeg has nothing to do with UI drift.
      - name: Run the showcase suite (artifacts discarded)
        run: make showcase
        env:
          SHOWCASE_OUT: ${{ runner.temp }}/showcase-discard
          SHOWCASE_SKIP_TRANSCODE: "1"

      - name: Upload failure diagnostics
        uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: showcase-rot-guard-diagnostics
          path: front/showcase/.artifacts/
          retention-days: 7
