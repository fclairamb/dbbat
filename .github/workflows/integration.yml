name: Integration tests

# The `-tags integration` suites start real databases with testcontainers, so
# they are far too slow for the per-PR CI job (which only runs
# `go vet -tags integration ./...` — proving they compile, not that they work).
# This workflow actually runs them, nightly and on demand.

on:
  schedule:
    # 03:17 UTC daily — off the hour to avoid the GitHub-wide cron stampede.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      package:
        description: "Package pattern to run (default: all non-Oracle proxies)"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-24.04
    strategy:
      # One protocol failing should not hide the state of the others.
      fail-fast: false
      matrix:
        package:
          - ./internal/proxy/postgresql/
          - ./internal/proxy/mysql/
          - ./internal/proxy/mongodb/
          - ./internal/proxy/mssql/
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.26.5"

      - name: Run integration suite
        run: go test -tags integration -timeout 40m -count=1 -v ${{ github.event.inputs.package || matrix.package }}

  # The Oracle suite is kept out of the matrix above: its images are slow to
  # boot, so it gets its own job with a longer budget.
  #
  # It runs twice, over ORACLE_TEST_IMAGE. The empty entry takes the suite
  # default — gvenzl/oracle-free:23-slim, see `defaultOracleImage` in
  # internal/proxy/oracle/integration_test.go — so CI exercises exactly what a
  # developer gets from a bare `make test-e2e-oracle`. The second pins
  # gvenzl/oracle-xe:18.4.0-slim: 18c XE coverage is kept, but as a deliberate
  # choice rather than an inherited default. Both run on amd64, because the XE
  # image is published for linux/amd64 only.
  oracle:
    name: oracle (${{ matrix.label }})
    runs-on: ubuntu-24.04
    strategy:
      # One image failing should not hide the state of the other.
      fail-fast: false
      matrix:
        include:
          - label: 23ai Free (suite default)
            image: ""
          - label: 18c XE (pinned)
            image: gvenzl/oracle-xe:18.4.0-slim
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.26.5"

      - name: Run Oracle integration suite
        env:
          ORACLE_TEST_IMAGE: ${{ matrix.image }}
        run: go test -tags integration -timeout 60m -count=1 -v ./internal/proxy/oracle/

  # The Kubernetes tunnel suite gets its own job for the same reason Oracle
  # does: it boots a whole k3s control plane in a privileged container before
  # any assertion runs, which does not belong in the per-protocol matrix's
  # budget. It is also the one suite whose *cluster* version matters — the
  # websocket port-forward transport is only on by default from 1.31 — so the
  # image is pinned in the suite and overridable here.
  kubernetes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.26.5"

      - name: Run Kubernetes tunnel integration suite
        run: go test -tags integration -timeout 40m -count=1 -v ./internal/proxy/kubernetes/
