name: Lint PR

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - edited

permissions:
  pull-requests: read

jobs:
  main:
    name: Validate PR title
    runs-on: ubuntu-24.04
    steps:
      - uses: amannn/action-semantic-pull-request@v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Keep this list identical to the **Scopes** line in the repository
          # root CLAUDE.md — a scope documented there but missing here fails
          # `Validate PR title` for a contributor who did read the docs.
          scopes: |
            api
            auth
            config
            crypto
            db
            deploy
            deps
            docs
            dump
            grants
            migrations
            mongodb
            mssql
            mysql
            oracle
            postgresql
            proxy
            store
            ui
            release
            ci
          requireScope: false
