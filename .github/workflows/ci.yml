name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "website/**"
      - ".github/workflows/website.yml"
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Lint Job - Go linting with golangci-lint
  # ===========================================================================
  lint:
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-please-')
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.26.6"

      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.13.1

  # ===========================================================================
  # Secrets Job - keep credentials out of the repository
  # ===========================================================================
  # A HAR export of an authenticated session was committed once (it carried a
  # live web_ session token). Two guards, cheapest first: a hard refusal of
  # capture-file extensions, then a full gitleaks scan of the pushed commits.
  secrets:
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-please-')
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans commit history, not just the tree

      # A HAR records whole requests — Authorization headers, cookies, tokens
      # in URLs — so it is a credential file even when it looks like a
      # debugging artifact. Same for a saved browser session or a raw cookie
      # jar. .gitignore stops the accident locally; this stops it in CI.
      - name: Refuse committed network captures
        run: |
          matches=$(git ls-files -- '*.har' '*.harfile' 'cookies.txt' 'cookies.json' || true)
          if [ -n "$matches" ]; then
            echo "::error::network capture / cookie files must never be committed:"
            echo "$matches"
            exit 1
          fi

      - uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is only required for organization accounts.
          # The action defaults to gitleaks 8.24.3, which does NOT apply a
          # top-level [[allowlists]] block to rules inherited from
          # `[extend] useDefault = true` — so every allowlist in
          # .gitleaks.toml was silently ignored and the job failed on its own
          # test fixtures. Fixed in a later gitleaks; 8.30.1 is verified
          # against this repo's config. Pin it rather than collapsing the
          # config into the single legacy [allowlist] table, which would cost
          # us the per-entry rationale the config requires.
          GITLEAKS_VERSION: 8.30.1

  # ===========================================================================
  # Frontend Job - Build React app with Bun
  # ===========================================================================
  frontend:
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-please-')
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Cache frontend dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            front/node_modules
            ~/.bun/install/cache
          key: frontend-${{ hashFiles('front/bun.lock') }}
          restore-keys: frontend-

      - name: Install dependencies
        run: bun install
        working-directory: front

      - name: Generate API types
        run: bun run generate-client
        working-directory: front

      # `scripts/build-frontend.sh` regenerates the client on every
      # `make build-front`, so a stale `schema.ts` never breaks a local build —
      # it just turns up as an unexplained modified file in the working tree,
      # which is invisible until it is noise in someone else's session. This is
      # the only signal that the committed types have fallen behind
      # `internal/api/openapi.yml`.
      - name: Check generated API types are committed
        run: |
          if ! git diff --exit-code front/src/api/schema.ts; then
            echo "::error file=front/src/api/schema.ts::generated API types are out of date with internal/api/openapi.yml — run 'cd front && bun run generate-client' and commit the result"
            exit 1
          fi

      - name: Lint frontend
        run: bun run lint
        working-directory: front

      - name: Type-check frontend
        run: bun run typecheck
        working-directory: front

      - name: Build frontend
        run: bun run build
        working-directory: front

      # Same deal one file over: the TanStack Router plugin re-emits
      # `routeTree.gen.ts` as part of `bun run build`, so a stale one is
      # likewise only ever visible as a dirty tree. It has to be checked after
      # the build rather than next to the types, because the build *is* its
      # generator.
      #
      # What makes this comparison sound is that the generator's output is a
      # pure function of the route files — which it is, but only from
      # `@tanstack/router-generator` 1.167.25 onwards. Earlier versions ended
      # their sort with the route-node object itself as the tiebreaker, so every
      # node compared equal and the order that survived was whatever the
      # parallel `readdir` recursion in `getRouteNodes` happened to build. Two
      # runs over identical sources could then differ by a couple of hundred
      # lines. `front/bun.lock` pins the generator and `bun install` above
      # installs from it into a fresh process, so this job always compares two
      # outputs of the *same* generator.
      #
      # Locally that guarantee has one more precondition CI does not: a `make
      # dev` Vite server keeps the plugin it imported at startup, so one that
      # outlived a dependency bump writes this file with the superseded
      # generator. `front/vite.config.ts` warns when it detects that; see
      # `specs/done/2026/08/2026-08-11-02-routetree-generator-nondeterminism.md`.
      - name: Check generated route tree is committed
        run: |
          if ! git diff --exit-code front/src/routeTree.gen.ts; then
            echo "::error file=front/src/routeTree.gen.ts::generated route tree is out of date — run 'cd front && bun run build' and commit the result"
            exit 1
          fi

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: frontend-dist
          path: front/dist/
          retention-days: 1

  # ===========================================================================
  # Test Job - Go unit tests with coverage
  # ===========================================================================
  test:
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-please-')
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.26.6"

      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...

      # The proxies' accept loop races their Shutdown only probabilistically —
      # the WaitGroup bug fixed in ea85c3f showed up about once in a few hundred
      # runs, so the single -race pass above would almost always have missed it.
      # Repeat just the Start+Shutdown tests enough times to make a regression
      # actually redden CI. ~90s for all five protocols.
      - name: Race-stress the proxy start/shutdown path
        run: >-
          go test -race -count=200
          -run 'TestServerStartAndShutdown|TestOracleServer_GracefulShutdown'
          ./internal/proxy/...

      # Integration-tagged tests need live databases and so never run here, but
      # they must at least keep compiling — otherwise they rot silently until
      # someone tries to run them.
      - name: Vet integration-tagged build
        run: go vet -tags integration ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v7.0.0
        with:
          files: coverage.out
        continue-on-error: true # Don't fail if codecov is not configured

  # ===========================================================================
  # Build Job - Build Go binary with embedded frontend
  # ===========================================================================
  build:
    runs-on: ubuntu-24.04
    needs: [frontend]
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-please-')
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # Needed for git log to get commit timestamp

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.26.6"

      - name: Download frontend artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: frontend-dist
          path: internal/api/resources/

      - name: Build binary
        run: |
          VERSION=${GITHUB_REF_NAME:-dev}
          COMMIT=${GITHUB_SHA::7}
          GIT_TIME=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)
          go build -ldflags "-X 'github.com/fclairamb/dbbat/internal/version.Version=$VERSION' \
                            -X 'github.com/fclairamb/dbbat/internal/version.Commit=$COMMIT' \
                            -X 'github.com/fclairamb/dbbat/internal/version.GitTime=$GIT_TIME'" \
            -o ./bin/dbbat .

      - name: Upload binary
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dbbat-binary
          path: bin/dbbat
          retention-days: 1

  # ===========================================================================
  # E2E Tests Job - Playwright tests against the built binary
  # ===========================================================================
  e2e-tests:
    runs-on: ubuntu-24.04
    needs: [build]
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-please-')
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Download binary
        uses: actions/download-artifact@v8.0.1
        with:
          name: dbbat-binary
          path: bin/

      - name: Make binary executable
        run: chmod +x bin/dbbat

      - name: Start PostgreSQL
        run: docker compose up -d postgres

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if docker compose exec -T postgres pg_isready -U postgres; then
              echo "PostgreSQL is ready"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done

      - name: Cache Playwright browsers
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('front/bun.lock') }}

      - name: Install Playwright
        run: |
          bun install
          bunx playwright install --with-deps chromium
        working-directory: front

      - name: Start DBBat server
        run: |
          ./bin/dbbat serve &
          echo "Server started in background, waiting for it to be ready..."
          # Wait for server to be ready (up to 30 seconds)
          for i in {1..30}; do
            if curl -s http://localhost:8080/api/v1/health > /dev/null 2>&1; then
              echo "Server is ready!"
              break
            fi
            echo "Waiting for server... ($i/30)"
            sleep 1
          done
          # Verify the app endpoint is accessible
          echo "Checking app endpoint..."
          curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/app/ || true
        env:
          DBB_RUN_MODE: test
          DBB_DSN: postgres://postgres:postgres@localhost:5001/dbbat?sslmode=disable
          DBB_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
          DBB_LISTEN_API: ":8080"
          DBB_RATE_LIMIT_ENABLED: "false"
          # Keep in step with front/e2e/global-setup.ts, which configures the
          # same provider for local runs: the users spec asserts on the roles
          # the directory mapping owns. Discovery is lazy, so this issuer is
          # never dialled — nothing signs in through it.
          DBB_OIDC_ISSUER: https://oidc.invalid.test
          DBB_OIDC_CLIENT_ID: dbbat-e2e
          DBB_OIDC_CLIENT_SECRET: dbbat-e2e-secret
          DBB_OIDC_DISPLAY_NAME: Test SSO
          DBB_OIDC_ROLE_MAPPING: viewer=analysts

      - name: Run Playwright tests
        run: bun run test:e2e:chromium
        working-directory: front

      - name: Upload test artifacts
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: playwright-results
          path: |
            front/playwright-report/
            front/test-results/
          retention-days: 7

      - name: Stop services
        if: always()
        run: docker compose down
