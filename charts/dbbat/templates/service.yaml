apiVersion: v1
kind: Service
metadata:
  name: {{ include "dbbat.fullname" . }}
  labels:
    {{- include "dbbat.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- with .Values.service.api.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.api.type }}
  ports:
    - port: {{ .Values.service.api.port }}
      targetPort: http
      protocol: TCP
      name: {{ default "http" .Values.service.api.portName }}
    {{- /*
    In-cluster access to the proxy on the API service, for a deployment where
    that is how clients already reach it. The port follows config.listenPg, the
    same address the container binds.
    */ -}}
    {{- if .Values.service.api.includeProxyPort }}
    - port: {{ include "dbbat.listenPort" .Values.config.listenPg | int }}
      targetPort: postgres
      protocol: TCP
      name: {{ default "postgres" .Values.service.proxy.portName }}
    {{- end }}
  selector:
    {{- include "dbbat.selectorLabels" . | nindent 4 }}
